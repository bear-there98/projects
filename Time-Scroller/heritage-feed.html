<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Scroller</title>
  <style>
    :root {
      --bg: #faf6ef;
      --text: #1a2332;
      --accent: #a04a2f;
      --muted: #6b6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ---------- Landing ---------- */
    .landing {
      padding: 48px 24px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .landing__title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    .landing__intro {
      color: var(--muted);
      margin-top: 12px;
      font-size: 18px;
    }

    .field {
      margin-top: 28px;
    }

    .field__label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field__select {
      width: 100%;
      font-family: inherit;
      font-size: 17px;
      color: var(--text);
      background: #fff;
      border: 1px solid rgba(26, 35, 50, 0.18);
      border-radius: 10px;
      padding: 13px 14px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b6b' stroke-width='1.6' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }

    .field__select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(160, 74, 47, 0.15);
    }

    .btn-begin {
      margin-top: 36px;
      width: 100%;
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-begin:hover:not(:disabled) {
      background: #8a3f28;
    }

    .btn-begin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .landing__message {
      margin-top: 18px;
      font-size: 16px;
      color: var(--accent);
      background: rgba(160, 74, 47, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }

    .landing__message[hidden] {
      display: none;
    }

    /* ---------- Shared ---------- */
    .back-link {
      display: inline-block;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .back-link::before {
      content: "← ";
    }

    /* ---------- Timeline ---------- */
    .timeline {
      padding: 24px 0 40px;
    }

    .timeline__head {
      padding: 0 24px;
    }

    .timeline__title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
    }

    .timeline__track {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 32px 24px 20px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .dot-wrap {
      flex: 0 0 auto;
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .dot {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: #fff;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .dot-wrap--unlocked .dot:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.06);
    }

    .dot-wrap--locked .dot {
      border-color: rgba(107, 107, 107, 0.4);
      color: rgba(107, 107, 107, 0.75);
      background: rgba(107, 107, 107, 0.06);
      cursor: pointer;
    }

    .dot__year {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .dot-wrap--locked .dot__year {
      color: var(--muted);
    }

    .dot__era {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
    }

    .dot__lock {
      font-size: 12px;
    }

    .dot__tooltip {
      position: absolute;
      bottom: calc(100% - 2px);
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      background: var(--text);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      border-radius: 8px;
      padding: 8px 10px;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(26, 35, 50, 0.25);
    }

    .dot__tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--text);
    }

    .dot__tooltip[hidden] {
      display: none;
    }

    /* ---------- Feed ---------- */
    .feed__bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid rgba(26, 35, 50, 0.1);
    }

    .feed__back {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
      cursor: pointer;
      padding: 4px 6px;
    }

    .feed__back:hover {
      color: var(--accent);
    }

    .feed__meta {
      flex: 1;
      min-width: 0;
    }

    .feed__era {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed__progress {
      font-size: 13px;
      color: var(--muted);
    }

    .feed__list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post {
      background: #fff;
      border: 1px solid rgba(26, 35, 50, 0.08);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(26, 35, 50, 0.04);
    }

    .post__head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post__avatar {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(160, 74, 47, 0.12);
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post__ident {
      min-width: 0;
    }

    .post__name {
      font-weight: 700;
    }

    .post__role {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
    }

    .post__body {
      margin-top: 12px;
    }

    /* Optional image slot — empty for now. */
    .post__image {
      margin-top: 12px;
    }

    .post__image:empty {
      display: none;
    }

    /* Slot for tappable heritage-language words. */
    .post__heritage {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .post__heritage:empty {
      display: none;
    }

    .heritage-word {
      font-style: italic;
      color: var(--accent);
      border-bottom: 1px dotted rgba(160, 74, 47, 0.7);
      cursor: pointer;
    }

    .heritage-word:hover {
      background: rgba(160, 74, 47, 0.08);
    }

    /* ---------- Word bottom sheet ---------- */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(26, 35, 50, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 26px 24px 32px;
      box-shadow: 0 -6px 24px rgba(26, 35, 50, 0.22);
      animation: sheet-up 0.2s ease;
    }

    @keyframes sheet-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet__word {
      font-size: 30px;
      font-weight: 700;
      font-style: italic;
      color: var(--accent);
      line-height: 1.2;
    }

    .sheet__translation {
      font-size: 19px;
      margin-top: 8px;
    }

    .sheet__pron {
      font-size: 15px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sheet__save {
      margin-top: 22px;
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(160, 74, 47, 0.08);
      border: 1px solid rgba(160, 74, 47, 0.35);
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
    }

    .sheet__save:hover {
      background: rgba(160, 74, 47, 0.14);
    }

    .sheet__save:disabled {
      cursor: default;
      opacity: 0.75;
    }

    .post__actions {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(26, 35, 50, 0.08);
      display: flex;
      gap: 22px;
    }

    .post__action {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
    }

    .post__action svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .post__action:hover {
      color: var(--accent);
    }

    .post__action.is-active {
      color: var(--accent);
    }

    /* ---------- Comments ---------- */
    .post__comments {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post__comments:empty {
      display: none;
    }

    .comment {
      font-size: 15px;
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(26, 35, 50, 0.04);
    }

    .comment__author {
      font-weight: 700;
      margin-right: 6px;
    }

    .comment--character {
      background: rgba(160, 74, 47, 0.07);
    }

    .comment--character .comment__author {
      color: var(--accent);
    }

    .comment--narrator {
      background: none;
      font-style: italic;
      color: var(--muted);
      padding: 4px 12px;
    }

    .comment--narrator .comment__author {
      font-style: normal;
    }

    .comment--quiz {
      background: rgba(160, 74, 47, 0.1);
      border: 1px solid rgba(160, 74, 47, 0.3);
    }

    .comment--quiz .comment__author {
      color: var(--accent);
    }

    .quiz__choices {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .quiz__choice {
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      background: #fff;
      border: 1px solid rgba(160, 74, 47, 0.4);
      border-radius: 8px;
      padding: 8px 22px;
      cursor: pointer;
    }

    .quiz__choice:hover {
      background: var(--accent);
      color: #fff;
    }

    .post__composer {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .post__composer[hidden] {
      display: none;
    }

    .post__composer input {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      border: 1px solid rgba(26, 35, 50, 0.18);
      border-radius: 20px;
      padding: 9px 14px;
    }

    .post__composer input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .post__composer button {
      flex: 0 0 auto;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 20px;
      padding: 9px 16px;
      cursor: pointer;
    }

    .post__composer button:hover {
      background: #8a3f28;
    }

    /* ---------- Year complete ---------- */
    .year-complete {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow-y: auto;
      animation: fade-in 0.35s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .year-complete__inner {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .year-complete__kicker {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
    }

    .year-complete__year {
      font-size: 28px;
      font-weight: 700;
      margin-top: 10px;
    }

    .year-complete__text {
      font-size: 18px;
      line-height: 1.7;
      margin-top: 20px;
      color: var(--text);
    }

    .year-complete__btn {
      margin-top: 32px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      cursor: pointer;
    }

    .year-complete__btn:hover {
      background: #8a3f28;
    }
  </style>
</head>

        inner.className = "year-complete__inner";

        var kicker = document.createElement("div");
        kicker.className = "year-complete__kicker";
        kicker.textContent = t("yearComplete");
        inner.appendChild(kicker);

        var heading = document.createElement("h2");
        heading.className = "year-complete__year";
        heading.textContent = entry ? entry.label + " — " + entry.era : "";
        inner.appendChild(heading);

        var para = document.createElement("p");
        para.className = "year-complete__text";
        para.textContent = text;
        inner.appendChild(para);

        var btn = document.createElement("button");
        btn.className = "year-complete__btn";
        btn.type = "button";
        btn.textContent = t("continueJourney");
        btn.addEventListener("click", function () {
          overlay.remove();
          renderTimeline();
          showView("view-timeline");
        });
        inner.appendChild(btn);

        overlay.appendChild(inner);
        document.body.appendChild(overlay);
      }

      // ---- Tag-in quiz ----

      // A character tags the user into the thread with a true/false question.
      function triggerQuiz(post, cardEl) {
        if (quizAnswered(post.id)) return;
        if (cardEl.getAttribute("data-quiz-shown") === "1") return;
        cardEl.setAttribute("data-quiz-shown", "1");

        var commentsEl = cardEl.querySelector(".post__comments");
        if (!commentsEl) return;

        var ch = getCharacter(post.character_id);
        var authorName = ch ? ch.name : post.name;

        var prompt = document.createElement("div");
        prompt.className = "comment comment--quiz";

        var author = document.createElement("span");
        author.className = "comment__author";
        author.textContent = authorName;
        prompt.appendChild(author);

        prompt.appendChild(document.createTextNode(
          "@" + state.displayName + " — " + post.quiz.question + "?"
        ));

        var choices = document.createElement("div");
        choices.className = "quiz__choices";
        [
          { label: t("answerTrue"), val: true },
          { label: t("answerFalse"), val: false }
        ].forEach(function (opt) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "quiz__choice";
          b.textContent = opt.label;
          b.addEventListener("click", function () {
            answerQuiz(post, opt.val, commentsEl, prompt, authorName);
          });
          choices.appendChild(b);
        });
        prompt.appendChild(choices);

        commentsEl.appendChild(prompt);
      }

      // Record the user's answer, then the character responds in-character
      // with the correct answer and a line of context.
      function answerQuiz(post, answer, commentsEl, promptEl, authorName) {
        var key = yearKey(state.culture, state.year);
        var rec = state.progress[key];
        if (!rec) rec = state.progress[key] = { read: {}, quizzes: {}, quizzesPassed: 0 };
        if (!rec.quizzes) rec.quizzes = {};
        if (rec.quizzes[post.id]) return; // already answered

        var correct = answer === post.quiz.correct_answer;
        rec.quizzes[post.id] = { answered: true, correct: correct };
        if (correct) rec.quizzesPassed = (rec.quizzesPassed || 0) + 1;

        // Freeze the choices.
        var choices = promptEl.querySelector(".quiz__choices");
        if (choices) choices.remove();

        // Show the user's chosen answer.
        var userComment = {
          author: state.displayName,
          text: answer ? t("answerTrue") : t("answerFalse"),
          type: "user"
        };
        addComment(post.id, userComment);
        commentsEl.appendChild(buildComment(userComment));

        // Character's in-character follow-up (correct answer + context).
        var follow = { author: authorName, text: post.quiz.follow_up, type: "character" };
        addComment(post.id, follow);
        commentsEl.appendChild(buildComment(follow));

        checkYearComplete();
      }

      // Build one post card.
      function buildPost(post) {
        var card = document.createElement("article");
        card.className = "post";

        // Head: avatar + name + role.
        var head = document.createElement("div");
        head.className = "post__head";

        var avatar = document.createElement("div");
        avatar.className = "post__avatar";
        avatar.textContent = post.initials || "";
        head.appendChild(avatar);

        var ident = document.createElement("div");
        ident.className = "post__ident";

        var name = document.createElement("span");
        name.className = "post__name";
        name.textContent = post.name;
        ident.appendChild(name);

        var role = document.createElement("span");
        role.className = "post__role";
        role.textContent = " · " + post.role;
        name.appendChild(role);

        head.appendChild(ident);
        card.appendChild(head);

        // Body — parsed for inline heritage-word markers.
        var body = document.createElement("p");
        body.className = "post__body";
        renderBody(post.body, body);
        card.appendChild(body);

        // Optional image slot — left empty for now.
        var image = document.createElement("div");
        image.className = "post__image";
        card.appendChild(image);

        // Actions: like, comment, save.
        var actions = document.createElement("div");
        actions.className = "post__actions";

        var likeBtn = makeActionButton("like");
        updateActionIcon(likeBtn, "like", !!state.liked[post.id]);
        likeBtn.addEventListener("click", function () {
          state.liked[post.id] = !state.liked[post.id];
          updateActionIcon(likeBtn, "like", !!state.liked[post.id]);
        });
        actions.appendChild(likeBtn);

        var commentBtn = makeActionButton("comment");
        updateActionIcon(commentBtn, "comment", false);
        actions.appendChild(commentBtn);

        var saveBtn = makeActionButton("save");
        updateActionIcon(saveBtn, "save", !!state.saved[post.id]);
        saveBtn.addEventListener("click", function () {
          state.saved[post.id] = !state.saved[post.id];
          updateActionIcon(saveBtn, "save", !!state.saved[post.id]);
        });
        actions.appendChild(saveBtn);

        card.appendChild(actions);

        // Existing comment thread.
        var comments = document.createElement("div");
        comments.className = "post__comments";
        (state.comments[post.id] || []).forEach(function (c) {
          comments.appendChild(buildComment(c));
        });
        card.appendChild(comments);

        // Comment composer, revealed by the comment action.
        var composer = document.createElement("form");
        composer.className = "post__composer";
        composer.hidden = true;

        var input = document.createElement("input");
        input.type = "text";
        input.setAttribute("maxlength", "140");
        input.placeholder = t("addComment");
        composer.appendChild(input);

        var send = document.createElement("button");
        send.type = "submit";
        send.textContent = t("send");
        composer.appendChild(send);

        composer.addEventListener("submit", function (e) {
          e.preventDefault();
          var text = input.value.trim();
          if (!text) return;
          input.value = "";
          submitComment(post, text, comments);
        });
        card.appendChild(composer);

        commentBtn.addEventListener("click", function () {
          composer.hidden = !composer.hidden;
          if (!composer.hidden) input.focus();
        });

        return card;
      }

      // ---- Post action icons ----
      function iconSvg(type, filled) {
        var fill = filled ? "currentColor" : "none";
        if (type === "like") {
          return '<svg viewBox="0 0 24 24" fill="' + fill + '" stroke="currentColor" ' +
            'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 ' +
            '3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 ' +
            '6.86-8.55 11.54L12 21.35z"/></svg>';
        }
        if (type === "save") {
          return '<svg viewBox="0 0 24 24" fill="' + fill + '" stroke="currentColor" ' +
            'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
        }
        // comment — never filled
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>';
      }

      function makeActionButton(key) {
        var btn = document.createElement("button");
        btn.className = "post__action";
        btn.type = "button";
        btn.setAttribute("aria-label", t(key));
        return btn;
      }

      function updateActionIcon(btn, type, active) {
        btn.innerHTML = iconSvg(type, active);
        if (active) {
          btn.classList.add("is-active");
        } else {
          btn.classList.remove("is-active");
        }
      }

      // ---- Comments ----
      function addComment(postId, comment) {
        if (!state.comments[postId]) state.comments[postId] = [];
        state.comments[postId].push(comment);
      }

      function buildComment(c) {
        var el = document.createElement("div");
        el.className = "comment comment--" + c.type;

        var author = document.createElement("span");
        author.className = "comment__author";
        author.textContent = c.author;
        el.appendChild(author);

        el.appendChild(document.createTextNode(c.text));
        return el;
      }

      // Handle a submitted user comment: store it, then generate an
      // in-character reply and (sometimes) a narrator quip.
      function submitComment(post, text, commentsEl) {
        var userComment = { author: state.displayName, text: text, type: "user" };
        addComment(post.id, userComment);
        commentsEl.appendChild(buildComment(userComment));

        var reply = getCharacterReply(post.character_id, text);
        if (reply) {
          var ch = getCharacter(post.character_id);
          var charComment = {
            author: ch ? ch.name : post.name,
            text: reply,
            type: "character"
          };
          addComment(post.id, charComment);
          commentsEl.appendChild(buildComment(charComment));
        }

        // ~20% chance the narrator drops a dry line.
        if (Math.random() < 0.2) {
          var narratorComment = {
            author: NARRATOR.name,
            text: pickRandom(NARRATOR.replies),
            type: "narrator"
          };
          addComment(post.id, narratorComment);
          commentsEl.appendChild(buildComment(narratorComment));
        }
      }

      // Keyword-match the comment against a character's REPLIES; fall back
      // to a generic in-character line when nothing matches.
      function getCharacterReply(charId, text) {
        var entry = REPLIES[charId];
        if (!entry) return null;

        var lower = text.toLowerCase();
        var keys = Object.keys(entry.keywords || {});
        for (var i = 0; i < keys.length; i++) {
          if (lower.indexOf(keys[i].toLowerCase()) !== -1) {
            return pickRandom(entry.keywords[keys[i]]);
          }
        }
        if (entry.fallback && entry.fallback.length) {
          return pickRandom(entry.fallback);
        }
        return null;
      }

      function getCharacter(charId) {
        var list = CHARACTERS[state.culture] || [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === charId) return list[i];
        }
        return null;
      }

      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // Parse a post body for [word|translation|pronunciation] markers and
      // render plain text as text, markers as clickable heritage words.
      var HERITAGE_MARKER = /\[([^\]|]+)\|([^\]|]+)\|([^\]]+)\]/g;

      function renderBody(text, container) {
        HERITAGE_MARKER.lastIndex = 0;
        var lastIndex = 0;
        var match;

        while ((match = HERITAGE_MARKER.exec(text)) !== null) {
          // Plain text before this marker.
          if (match.index > lastIndex) {
            container.appendChild(
              document.createTextNode(text.slice(lastIndex, match.index))
            );
          }

          var word = match[1];
          var translation = match[2];
          var pronunciation = match[3];

          var span = document.createElement("span");
          span.className = "heritage-word";
          span.textContent = word;
          span.addEventListener("click", function (w, tr, pr) {
            return function (e) {
              e.stopPropagation();
              openWordSheet(w, tr, pr);
            };
          }(word, translation, pronunciation));
          container.appendChild(span);

          lastIndex = HERITAGE_MARKER.lastIndex;
        }

        // Trailing plain text.
        if (lastIndex < text.length) {
          container.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      }

      // ---- Word bottom sheet ----
      var activeSheet = null;

      function closeWordSheet() {
        if (activeSheet) {
          activeSheet.remove();
          activeSheet = null;
        }
      }

      function openWordSheet(word, translation, pronunciation) {
        closeWordSheet();

        var backdrop = document.createElement("div");
        backdrop.className = "sheet-backdrop";
        // Outside click (on the backdrop) closes the sheet.
        backdrop.addEventListener("click", closeWordSheet);

        var sheet = document.createElement("div");
        sheet.className = "sheet";
        // Clicks inside the sheet must not close it.
        sheet.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        var wordEl = document.createElement("div");
        wordEl.className = "sheet__word";
        wordEl.textContent = word;
        sheet.appendChild(wordEl);

        var transEl = document.createElement("div");
        transEl.className = "sheet__translation";
        transEl.textContent = translation;
        sheet.appendChild(transEl);

        var pronEl = document.createElement("div");
        pronEl.className = "sheet__pron";
        pronEl.textContent = pronunciation;
        sheet.appendChild(pronEl);

        var save = document.createElement("button");
        save.className = "sheet__save";
        save.type = "button";
        save.textContent = t("saveToNotebook");
        // Notebook persistence is a later feature; give light feedback for now.
        save.addEventListener("click", function () {
          save.textContent = t("savedToNotebook");
          save.disabled = true;
        });
        sheet.appendChild(save);

        backdrop.appendChild(sheet);
        document.body.appendChild(backdrop);
        activeSheet = backdrop;
      }

      // Build a labeled <select> with a disabled placeholder option.
      // Returns { field, select } so callers can wire change events.
      function buildSelect(labelText, options) {
        var field = document.createElement("div");
        field.className = "field";

        var label = document.createElement("label");
        label.className = "field__label";
        label.textContent = labelText;

        var select = document.createElement("select");
        select.className = "field__select";

        var placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = t("selectPlaceholder");
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);

        options.forEach(function (opt) {
          var o = document.createElement("option");
          o.value = opt.code;
          o.textContent = opt.label;
          select.appendChild(o);
        });

        label.setAttribute("for", "");
        field.appendChild(label);
        field.appendChild(select);
        return { field: field, select: select };
      }

      // Expose for later wiring.
      window.showView = showView;

      // Initial render — landing is shown by default.
      renderLanding();
      showView("view-landing");
    })();
  </script>
</body>
</html>
