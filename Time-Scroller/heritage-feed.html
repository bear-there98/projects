<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Scroller</title>
  <style>
    :root {
      --bg: #faf6ef;
      --text: #1a2332;
      --accent: #a04a2f;
      --muted: #6b6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ---------- Landing ---------- */
    .landing {
      padding: 48px 24px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .landing__title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    .landing__intro {
      color: var(--muted);
      margin-top: 12px;
      font-size: 18px;
    }

    .field {
      margin-top: 28px;
    }

    .field__label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field__select {
      width: 100%;
      font-family: inherit;
      font-size: 17px;
      color: var(--text);
      background: #fff;
      border: 1px solid rgba(26, 35, 50, 0.18);
      border-radius: 10px;
      padding: 13px 14px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b6b' stroke-width='1.6' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }

    .field__select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(160, 74, 47, 0.15);
    }

    .btn-begin {
      margin-top: 36px;
      width: 100%;
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-begin:hover:not(:disabled) {
      background: #8a3f28;
    }

    .btn-begin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .landing__message {
      margin-top: 18px;
      font-size: 16px;
      color: var(--accent);
      background: rgba(160, 74, 47, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }

    .landing__message[hidden] {
      display: none;
    }

    /* ---------- Shared ---------- */
    .back-link {
      display: inline-block;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .back-link::before {
      content: "← ";
    }

    /* ---------- Timeline ---------- */
    .timeline {
      padding: 24px 0 40px;
    }

    .timeline__head {
      padding: 0 24px;
    }

    .timeline__title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
    }

    .timeline__track {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 32px 24px 20px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .dot-wrap {
      flex: 0 0 auto;
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .dot {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: #fff;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .dot-wrap--unlocked .dot:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.06);
    }

    .dot-wrap--locked .dot {
      border-color: rgba(107, 107, 107, 0.4);
      color: rgba(107, 107, 107, 0.75);
      background: rgba(107, 107, 107, 0.06);
      cursor: pointer;
    }

    .dot__year {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .dot-wrap--locked .dot__year {
      color: var(--muted);
    }

    .dot__era {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
    }

    .dot__lock {
      font-size: 12px;
    }

    .dot__tooltip {
      position: absolute;
      bottom: calc(100% - 2px);
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      background: var(--text);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      border-radius: 8px;
      padding: 8px 10px;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(26, 35, 50, 0.25);
    }

    .dot__tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--text);
    }

    .dot__tooltip[hidden] {
      display: none;
    }

    /* ---------- Feed ---------- */
    .feed__bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid rgba(26, 35, 50, 0.1);
    }

    .feed__back {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
      cursor: pointer;
      padding: 4px 6px;
    }

    .feed__back:hover {
      color: var(--accent);
    }

    .feed__meta {
      flex: 1;
      min-width: 0;
    }

    .feed__era {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed__progress {
      font-size: 13px;
      color: var(--muted);
    }

    .feed__list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post {
      background: #fff;
      border: 1px solid rgba(26, 35, 50, 0.08);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(26, 35, 50, 0.04);
    }

    .post__head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post__avatar {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(160, 74, 47, 0.12);
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post__ident {
      min-width: 0;
    }

    .post__name {
      font-weight: 700;
    }

    .post__role {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
    }

    .post__body {
      margin-top: 12px;
    }

    /* Optional image slot — empty for now. */
    .post__image {
      margin-top: 12px;
    }

    .post__image:empty {
      display: none;
    }

    /* Slot for tappable heritage-language words. */
    .post__heritage {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .post__heritage:empty {
      display: none;
    }

    .heritage-word {
      font-style: italic;
      color: var(--accent);
      border-bottom: 1px dashed rgba(160, 74, 47, 0.5);
      cursor: pointer;
    }

    .post__actions {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(26, 35, 50, 0.08);
      display: flex;
      gap: 22px;
    }

    .post__action {
      background: none;
      border: none;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 2px;
    }

    .post__action:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="view-landing" class="view active"></div>
    <div id="view-timeline" class="view"></div>
    <div id="view-feed" class="view"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ----------------------------------------------------------------
      // DATA — drives the whole app.
      // ----------------------------------------------------------------

      // Interface languages the user can read the app in.
      var LANGUAGES = [
        { code: "en", label: "English" },
        { code: "be", label: "Беларуская" }
      ];

      // Heritage cultures the user can explore.
      var CULTURES = [
        { code: "pl", label: "Polish" },
        { code: "it", label: "Italian" },
        { code: "es", label: "Spanish" }
      ];

      // Every user-facing UI string, keyed by interface-language code.
      // English is populated now; Belarusian keys are present but empty —
      // they will be filled in a later batch for authenticity.
      var UI_STRINGS = {
        en: {
          appTitle: "Time Scroller",
          tagline: "Scroll through a culture, one moment at a time.",
          intro: "Step into a culture through the people who lived it.",
          iSpeak: "I speak",
          iWantToExplore: "I want to explore",
          selectPlaceholder: "Select…",
          begin: "Begin",
          comingSoonMessage: "This journey is coming soon. For now, try English → Polish.",
          chooseWhereToBegin: "Choose where to begin",
          lockedTooltip: "Complete the previous year to unlock",
          postsRead: "posts read",
          like: "Like",
          save: "Save",
          comment: "Comment",
          chooseLanguage: "Choose your language",
          chooseCulture: "Choose a heritage to explore",
          start: "Start",
          continue: "Continue",
          back: "Back",
          comingSoon: "Coming soon",
          timelineTitle: "Timeline",
          feedTitle: "Feed",
          viewTimeline: "View timeline",
          viewFeed: "View feed",
          settings: "Settings",
          language: "Language",
          culture: "Culture"
        },
        be: {
          appTitle: "",
          tagline: "",
          intro: "",
          iSpeak: "",
          iWantToExplore: "",
          selectPlaceholder: "",
          begin: "",
          comingSoonMessage: "",
          chooseWhereToBegin: "",
          lockedTooltip: "",
          postsRead: "",
          like: "",
          save: "",
          comment: "",
          chooseLanguage: "",
          chooseCulture: "",
          start: "",
          continue: "",
          back: "",
          comingSoon: "",
          timelineTitle: "",
          feedTitle: "",
          viewTimeline: "",
          viewFeed: "",
          settings: "",
          language: "",
          culture: ""
        }
      };

      // Which "languageCode_cultureCode" pairings actually have content.
      // Only en_pl is ready; the rest are coming soon.
      var CONTENT_AVAILABILITY = {
        en_pl: true,
        en_it: false,
        en_es: false,
        be_pl: false,
        be_it: false,
        be_es: false
      };

      // Timeline entries keyed by culture code. Each entry is a pivotal
      // year with a short era name. "present" is a special open-ended point.
      var TIMELINE = {
        pl: [
          { year: 1795, label: "1795", era: "Third Partition" },
          { year: 1830, label: "1830", era: "November Uprising" },
          { year: 1863, label: "1863", era: "January Uprising" },
          { year: 1918, label: "1918", era: "Independence" },
          { year: 1939, label: "1939", era: "Invasion" },
          { year: 1945, label: "1945", era: "Aftermath" },
          { year: 1968, label: "1968", era: "March Unrest" },
          { year: 1989, label: "1989", era: "Round Table" },
          { year: 2004, label: "2004", era: "Into Europe" },
          { year: "present", label: "Now", era: "Present Day" }
        ]
      };

      // Feed posts. Placeholder content for now so the layout is visible.
      // Each post: character identity, body text, an optional image slot,
      // and heritage-language words to surface inline.
      var POSTS = [
        {
          id: "p1",
          name: "Marek Kowalczyk",
          role: "farmer",
          initials: "MK",
          body: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " +
            "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
          image: null,
          heritageWords: ["dom", "ziemia"]
        },
        {
          id: "p2",
          name: "Zofia Wiśniewska",
          role: "seamstress",
          initials: "ZW",
          body: "Ut enim ad minim veniam, quis nostrud exercitation ullamco " +
            "laboris nisi ut aliquip ex ea commodo consequat.",
          image: null,
          heritageWords: ["igła", "nić"]
        },
        {
          id: "p3",
          name: "Jan Nowak",
          role: "schoolteacher",
          initials: "JN",
          body: "Duis aute irure dolor in reprehenderit in voluptate velit " +
            "esse cillum dolore eu fugiat nulla pariatur.",
          image: null,
          heritageWords: ["szkoła", "wolność"]
        }
      ];

      // ----------------------------------------------------------------
      // STATE
      // ----------------------------------------------------------------

      // The chosen journey. uiLang drives which UI_STRINGS set we read;
      // it defaults to English while the user is still on the landing screen.
      var state = {
        uiLang: "en",
        language: null,
        culture: null,
        year: null
      };

      // Look up a UI string for the current interface language, falling
      // back to English when a translation is still empty.
      function t(key) {
        var set = UI_STRINGS[state.uiLang] || UI_STRINGS.en;
        return set[key] || UI_STRINGS.en[key] || "";
      }

      // ----------------------------------------------------------------
      // VIEW ROUTING
      // ----------------------------------------------------------------

      var views = ["view-landing", "view-timeline", "view-feed"];

      function showView(id) {
        views.forEach(function (viewId) {
          var el = document.getElementById(viewId);
          if (!el) return;
          if (viewId === id) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        });
      }

      // ----------------------------------------------------------------
      // LANDING VIEW
      // ----------------------------------------------------------------

      function renderLanding() {
        var root = document.getElementById("view-landing");
        root.innerHTML = "";

        var wrap = document.createElement("div");
        wrap.className = "landing";

        // App title placeholder — replaced later.
        var title = document.createElement("h1");
        title.className = "landing__title";
        title.textContent = t("appTitle");
        wrap.appendChild(title);

        // Intro copy.
        var intro = document.createElement("p");
        intro.className = "landing__intro";
        intro.textContent = t("intro");
        wrap.appendChild(intro);

        // "I speak" — language dropdown.
        var langSelect = buildSelect(t("iSpeak"), LANGUAGES);
        wrap.appendChild(langSelect.field);

        // "I want to explore" — culture dropdown.
        var cultureSelect = buildSelect(t("iWantToExplore"), CULTURES);
        wrap.appendChild(cultureSelect.field);

        // Begin button — disabled until both dropdowns have a value.
        var begin = document.createElement("button");
        begin.className = "btn-begin";
        begin.type = "button";
        begin.textContent = t("begin");
        begin.disabled = true;
        wrap.appendChild(begin);

        // Soft inline message (hidden until needed).
        var message = document.createElement("p");
        message.className = "landing__message";
        message.hidden = true;
        wrap.appendChild(message);

        function syncBeginState() {
          message.hidden = true;
          begin.disabled = !(langSelect.select.value && cultureSelect.select.value);
        }

        langSelect.select.addEventListener("change", syncBeginState);
        cultureSelect.select.addEventListener("change", syncBeginState);

        begin.addEventListener("click", function () {
          var lang = langSelect.select.value;
          var culture = cultureSelect.select.value;
          if (!lang || !culture) return;

          if (CONTENT_AVAILABILITY[lang + "_" + culture]) {
            state.language = lang;
            state.culture = culture;
            renderTimeline();
            showView("view-timeline");
          } else {
            message.textContent = t("comingSoonMessage");
            message.hidden = false;
          }
        });

        root.appendChild(wrap);
      }

      // ----------------------------------------------------------------
      // TIMELINE VIEW
      // ----------------------------------------------------------------

      function renderTimeline() {
        var root = document.getElementById("view-timeline");
        root.innerHTML = "";

        var wrap = document.createElement("div");
        wrap.className = "timeline";

        var head = document.createElement("div");
        head.className = "timeline__head";

        // Back link to landing.
        var back = document.createElement("button");
        back.className = "back-link";
        back.type = "button";
        back.textContent = t("back");
        back.addEventListener("click", function () {
          showView("view-landing");
        });
        head.appendChild(back);

        var title = document.createElement("h2");
        title.className = "timeline__title";
        title.textContent = t("chooseWhereToBegin");
        head.appendChild(title);

        wrap.appendChild(head);

        // Horizontal scrollable row of year dots.
        var track = document.createElement("div");
        track.className = "timeline__track";

        var years = TIMELINE[state.culture] || [];

        years.forEach(function (entry, index) {
          // For now only the first year is unlocked.
          var unlocked = index === 0;
          track.appendChild(buildDot(entry, unlocked));
        });

        wrap.appendChild(track);
        root.appendChild(wrap);
      }

      // Build one timeline dot (year circle + labels + lock/tooltip).
      function buildDot(entry, unlocked) {
        var dotWrap = document.createElement("div");
        dotWrap.className =
          "dot-wrap " + (unlocked ? "dot-wrap--unlocked" : "dot-wrap--locked");

        var dot = document.createElement("button");
        dot.className = "dot";
        dot.type = "button";

        if (unlocked) {
          dot.textContent = entry.label;
        } else {
          var lock = document.createElement("span");
          lock.className = "dot__lock";
          lock.textContent = "🔒";
          dot.appendChild(lock);
        }
        dotWrap.appendChild(dot);

        var year = document.createElement("div");
        year.className = "dot__year";
        year.textContent = entry.label;
        dotWrap.appendChild(year);

        var era = document.createElement("div");
        era.className = "dot__era";
        era.textContent = entry.era;
        dotWrap.appendChild(era);

        if (unlocked) {
          dot.addEventListener("click", function () {
            state.year = entry.year;
            renderFeed();
            showView("view-feed");
          });
        } else {
          // Locked years reveal a small tooltip on click.
          var tip = document.createElement("div");
          tip.className = "dot__tooltip";
          tip.textContent = t("lockedTooltip");
          tip.hidden = true;
          dotWrap.appendChild(tip);

          dot.addEventListener("click", function () {
            hideAllTooltips();
            tip.hidden = false;
          });
        }

        return dotWrap;
      }

      // Hide every open timeline tooltip.
      function hideAllTooltips() {
        var tips = document.querySelectorAll(".dot__tooltip");
        Array.prototype.forEach.call(tips, function (tip) {
          tip.hidden = true;
        });
      }

      // Dismiss tooltips when tapping elsewhere.
      document.addEventListener("click", function (e) {
        if (!e.target.closest || !e.target.closest(".dot-wrap--locked")) {
          hideAllTooltips();
        }
      });

      // ----------------------------------------------------------------
      // FEED VIEW
      // ----------------------------------------------------------------

      function renderFeed() {
        var root = document.getElementById("view-feed");
        root.innerHTML = "";

        // Find the timeline entry matching the selected year, for the label.
        var years = TIMELINE[state.culture] || [];
        var entry = null;
        years.forEach(function (y) {
          if (y.year === state.year) entry = y;
        });

        // ---- Sticky top bar ----
        var bar = document.createElement("div");
        bar.className = "feed__bar";

        var back = document.createElement("button");
        back.className = "feed__back";
        back.type = "button";
        back.setAttribute("aria-label", t("back"));
        back.textContent = "←";
        back.addEventListener("click", function () {
          showView("view-timeline");
        });
        bar.appendChild(back);

        var meta = document.createElement("div");
        meta.className = "feed__meta";

        var era = document.createElement("div");
        era.className = "feed__era";
        era.textContent = entry ? entry.label + " — " + entry.era : "";
        meta.appendChild(era);

        var progress = document.createElement("div");
        progress.className = "feed__progress";
        progress.textContent = "0 / " + POSTS.length + " " + t("postsRead");
        meta.appendChild(progress);

        bar.appendChild(meta);
        root.appendChild(bar);

        // ---- Vertical scrolling feed ----
        var list = document.createElement("div");
        list.className = "feed__list";

        POSTS.forEach(function (post) {
          list.appendChild(buildPost(post));
        });

        root.appendChild(list);
      }

      // Build one post card.
      function buildPost(post) {
        var card = document.createElement("article");
        card.className = "post";

        // Head: avatar + name + role.
        var head = document.createElement("div");
        head.className = "post__head";

        var avatar = document.createElement("div");
        avatar.className = "post__avatar";
        avatar.textContent = post.initials || "";
        head.appendChild(avatar);

        var ident = document.createElement("div");
        ident.className = "post__ident";

        var name = document.createElement("span");
        name.className = "post__name";
        name.textContent = post.name;
        ident.appendChild(name);

        var role = document.createElement("span");
        role.className = "post__role";
        role.textContent = " · " + post.role;
        name.appendChild(role);

        head.appendChild(ident);
        card.appendChild(head);

        // Body.
        var body = document.createElement("p");
        body.className = "post__body";
        body.textContent = post.body;
        card.appendChild(body);

        // Optional image slot — left empty for now.
        var image = document.createElement("div");
        image.className = "post__image";
        card.appendChild(image);

        // Heritage-language words slot — styled, not yet interactive.
        var heritage = document.createElement("div");
        heritage.className = "post__heritage";
        (post.heritageWords || []).forEach(function (word) {
          var span = document.createElement("span");
          span.className = "heritage-word";
          span.textContent = word;
          heritage.appendChild(span);
        });
        card.appendChild(heritage);

        // Actions: like, comment, save (icons only).
        var actions = document.createElement("div");
        actions.className = "post__actions";
        [
          { icon: "♡", key: "like" },
          { icon: "💬", key: "comment" },
          { icon: "🔖", key: "save" }
        ].forEach(function (a) {
          var btn = document.createElement("button");
          btn.className = "post__action";
          btn.type = "button";
          btn.setAttribute("aria-label", t(a.key));
          btn.textContent = a.icon;
          actions.appendChild(btn);
        });
        card.appendChild(actions);

        return card;
      }

      // Build a labeled <select> with a disabled placeholder option.
      // Returns { field, select } so callers can wire change events.
      function buildSelect(labelText, options) {
        var field = document.createElement("div");
        field.className = "field";

        var label = document.createElement("label");
        label.className = "field__label";
        label.textContent = labelText;

        var select = document.createElement("select");
        select.className = "field__select";

        var placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = t("selectPlaceholder");
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);

        options.forEach(function (opt) {
          var o = document.createElement("option");
          o.value = opt.code;
          o.textContent = opt.label;
          select.appendChild(o);
        });

        label.setAttribute("for", "");
        field.appendChild(label);
        field.appendChild(select);
        return { field: field, select: select };
      }

      // Expose for later wiring.
      window.showView = showView;

      // Initial render — landing is shown by default.
      renderLanding();
      showView("view-landing");
    })();
  </script>
</body>
</html>
