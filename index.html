<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirrorcore Lab</title>
<meta name="description" content="Mirrorcore Lab. Experiments." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&amp;family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&amp;display=swap" rel="stylesheet" />
<style>
  /* ==================================================================
     MIRRORCORE LAB
     One sheet of warm paper. Near black ink, hairlines, and a great
     deal of nothing. Each experiment is a plate: a quiet drawing, a
     number, a name. Behind it all, one large mark that changes as you
     move along the shelf. The shelf is read against a ruler.
     ================================================================== */

  :root {
    color-scheme: light;

    --paper:  #efece4;
    --ink:    #16150f;
    --ink-2:  rgba(22, 21, 15, 0.54);
    --ink-3:  rgba(22, 21, 15, 0.33);
    --rule:   rgba(22, 21, 15, 0.20);
    --hair:   rgba(22, 21, 15, 0.11);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono:  "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --margin: clamp(1.5rem, 7vw, 7.5rem);
    --plate:  clamp(252px, 26vw, 332px);
    --pad:    clamp(1.4rem, 2.6vw, 2.75rem);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; background: var(--paper); }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: rgba(22, 21, 15, 0.14); }

  a { color: inherit; text-decoration: none; }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 7px; }

  /* ---- the ambient mark ------------------------------------------
     One large drawing sits behind the sheet, at the threshold of
     visible. It changes with the experiment you are standing in
     front of, slowly enough that you notice it late. */

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient svg {
    position: absolute;
    top: 27%;
    right: -11vw;
    transform: translateY(-50%);
    width: min(74vw, 1040px);
    height: auto;
    color: var(--ink);
    opacity: 0;
    transition: opacity 1.7s ease;
  }
  .ambient svg.is-on { opacity: 1; }
  .a-line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.055;
  }

  .mast, .work { position: relative; z-index: 1; }

  /* ---- masthead ------------------------------------------------- */

  .mast { padding: clamp(4rem, 13vh, 8.5rem) var(--margin) 0; }

  .mast h1 {
    font-family: var(--serif);
    font-weight: 200;
    font-size: clamp(1.4rem, 3.1vw, 2.5rem);
    letter-spacing: 0.155em;
    text-transform: uppercase;
    line-height: 1;
    text-indent: 0.155em;
  }

  /* ---- section head --------------------------------------------- */

  .work { padding-top: clamp(4.5rem, 18vh, 11.5rem); }

  .eyebrow {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.66rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ink-2);
    text-indent: 0.34em;
    margin: 0 var(--margin) 0.85rem;
  }

  /* The rule under the head runs to the right edge of the sheet; the
     ruler at the foot stops short. The two lengths make the asymmetry. */
  .work-rule {
    height: 1px;
    background: var(--rule);
    margin-left: var(--margin);
  }

  /* ---- the shelf ------------------------------------------------- */

  .rail {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    /* No snapping. The shelf slides freely under the hand and the ruler
       reads off whichever plate you have come to rest in front of. */
    scroll-padding-left: var(--margin);
    padding: clamp(2rem, 4.5vh, 3.25rem) var(--margin) 0;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }

  .plate {
    flex: 0 0 var(--plate);
    padding-left: var(--pad);
    border-left: 1px solid var(--hair);
    display: block;
  }
  /* The first plate hangs flush with the masthead. Its basis drops by the
     padding the others carry, so every drawing is set to one width. */
  .plate:first-child {
    padding-left: 0;
    border-left: 0;
    flex-basis: calc(var(--plate) - var(--pad));
  }

  .figure { color: var(--ink); }
  .figure svg { display: block; width: 100%; height: auto; overflow: visible; }

  .figure-rule {
    height: 1px;
    background: var(--rule);
    margin-top: clamp(1.35rem, 2.6vh, 2.1rem);
  }

  /* One fixed height for every caption, so the way in always sits on
     the same line and the hairlines all run to the same depth. */
  .label {
    display: flex;
    flex-direction: column;
    min-height: 8.4rem;
    padding-top: 0.95rem;
  }

  .idx {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    color: var(--ink-3);
  }

  .name {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(1.3rem, 1.5vw, 1.6rem);
    line-height: 1.12;
    letter-spacing: 0.005em;
    margin-top: 0.65rem;
  }

  /* A status appears only when it says something. Everything without
     one is simply running. */
  .state {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 0.75rem;
  }

  .enter {
    align-self: flex-start;
    display: inline-flex;
    align-items: baseline;
    gap: 0.85em;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.64rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-top: auto;
    padding-bottom: 0.42rem;
    position: relative;
    transition: color 0.5s ease;
  }
  .enter::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s cubic-bezier(0.22, 0.7, 0.2, 1);
  }
  .arrow { transition: transform 0.5s cubic-bezier(0.22, 0.7, 0.2, 1); }

  .plate:hover .enter,
  .plate:focus-visible .enter { color: var(--ink); }
  .plate:hover .enter::after,
  .plate:focus-visible .enter::after { transform: scaleX(1); }
  .plate:hover .arrow,
  .plate:focus-visible .arrow { transform: translateX(0.5em); }

  .is-unformed .name { color: var(--ink-3); }

  /* ---- ruler ----------------------------------------------------- */

  .scale {
    display: flex;
    margin: clamp(2.25rem, 5vh, 3.5rem) var(--margin) 0;
    border-top: 1px solid var(--rule);
    max-width: 42rem;
  }

  .tick {
    flex: 1 1 0;
    position: relative;
    padding-top: 1.45rem;
    /* four minor divisions inside every unit */
    background-image: repeating-linear-gradient(to right, var(--hair) 0 1px, transparent 1px 25%);
    background-size: 100% 6px;
    background-repeat: no-repeat;
  }
  .tick::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 1px;
    height: 13px;
    background: var(--ink-3);
    transition: height 0.5s ease, background-color 0.5s ease;
  }
  .tick[aria-current]::before { height: 21px; background: var(--ink); }

  .tick-num {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--ink-3);
    transition: color 0.5s ease;
  }
  .tick[aria-current] .tick-num,
  .tick:hover .tick-num { color: var(--ink); }

  /* ---- drawing ink ----------------------------------------------- */

  .f-line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.66;
  }
  .f-soft { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; opacity: 0.34; }
  .f-rule { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.17; }
  .f-dot  { fill: currentColor; stroke: none; opacity: 0.52; }

  /* ---- reveal ---------------------------------------------------- */

  .js .figure {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.22, 0.7, 0.2, 1);
  }
  .js .is-seen .figure { opacity: 0.92; transform: none; }
  .js .plate:hover .figure { opacity: 1; }

  .js .f-draw {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
  }
  .js .is-seen .f-draw {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1.8s cubic-bezier(0.16, 0.7, 0.24, 1) 0.2s;
  }

  @media (prefers-reduced-motion: reduce) {
    .js .figure { opacity: 0.92; transform: none; transition: none; }
    .js .f-draw { stroke-dashoffset: 0; transition: none; }
    .enter::after, .arrow, .tick::before { transition: none; }
    .ambient svg { transition: opacity 0.4s ease; }
  }

  /* ---- narrow ---------------------------------------------------- */

  @media (max-width: 700px) {
    :root { --plate: 76vw; --pad: 1.35rem; }
    .mast { padding-top: clamp(3rem, 9vh, 5rem); }
    .work { padding-top: clamp(3.25rem, 12vh, 7rem); }
    .label { min-height: 7.6rem; }
    .scale { max-width: none; }
    /* On a narrow sheet the mark reads as a fragment off the edge, so it
       stays atmosphere rather than a line drawn through the plate. */
    .ambient svg { width: 132vw; right: -48vw; top: 23%; }
    .a-line { opacity: 0.032; }
  }
</style>
</head>

<script>
  // Without this file the shelf still works: the plates are links inside a
  // native scroll container, swipe scrolls it, and the ruler is a list of
  // anchors. Everything below is there to make it effortless.
  (function () {
    "use strict";

    var rail = document.getElementById("rail");
    if (!rail) return;

    var plates = Array.prototype.slice.call(rail.querySelectorAll(".plate"));
    var ticks = Array.prototype.slice.call(document.querySelectorAll(".tick"));
    var marks = Array.prototype.slice.call(document.querySelectorAll(".ambient svg"));
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)");

    // ---- ink the drawings once, as they arrive ----
    if ("IntersectionObserver" in window) {
      var seen = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add("is-seen");
          seen.unobserve(e.target);
        });
      }, { threshold: 0.3 });
      plates.forEach(function (p) { seen.observe(p); });
      // A drawing must never be left unread because an observer stayed
      // quiet. Anything standing in the viewport is inked regardless.
      setTimeout(function () {
        plates.forEach(function (p) {
          var b = p.getBoundingClientRect();
          if (b.left < window.innerWidth && b.right > 0) p.classList.add("is-seen");
        });
      }, 2200);
    } else {
      plates.forEach(function (p) { p.classList.add("is-seen"); });
    }

    // ---- where you are ----
    function span() { return rail.scrollWidth - rail.clientWidth; }

    function pitch() {
      if (plates.length < 2) return rail.clientWidth;
      var d = plates[1].offsetLeft - plates[0].offsetLeft;
      return d > 0 ? d : rail.clientWidth;
    }

    var held = null;
    var holdTimer;
    var shown = -1;

    function indexNow() {
      if (held !== null) return held;
      // At the far end the last plate never reaches the left edge, so read
      // the end of the shelf as the last plate rather than the nearest one.
      var max = span();
      if (max > 2 && rail.scrollLeft >= max - 2) return plates.length - 1;
      return Math.max(0, Math.min(plates.length - 1, Math.round(rail.scrollLeft / pitch())));
    }

    function mark() {
      var i = indexNow();
      if (i === shown) return;
      shown = i;
      ticks.forEach(function (t, n) {
        if (n === i) t.setAttribute("aria-current", "true");
        else t.removeAttribute("aria-current");
      });
      marks.forEach(function (m, n) { m.classList.toggle("is-on", n === i); });
    }

    function goTo(i) {
      i = Math.max(0, Math.min(plates.length - 1, i));
      held = i;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(function () { held = null; shown = -1; mark(); }, 700);
      rail.scrollTo({
        left: plates[i].offsetLeft - plates[0].offsetLeft,
        behavior: calm.matches ? "auto" : "smooth"
      });
      mark();
    }

    rail.addEventListener("scroll", mark, { passive: true });
    window.addEventListener("resize", function () { shown = -1; mark(); });
    mark();

    // ---- wheel and trackpad ----
    // A vertical wheel walks the shelf sideways. At either end the page
    // gets the gesture back, so nothing ever feels trapped.
    window.addEventListener("wheel", function (e) {
      if (e.ctrlKey) return;
      var max = span();
      if (max < 4) return;
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (!d) return;
      if (e.deltaMode === 1) d *= 16;
      else if (e.deltaMode === 2) d *= rail.clientWidth;
      if (d < 0 && rail.scrollLeft <= 0) return;
      if (d > 0 && rail.scrollLeft >= max - 1) return;
      held = null;
      rail.scrollLeft += d;
      e.preventDefault();
    }, { passive: false });

    // ---- ruler ----
    ticks.forEach(function (t) {
      t.addEventListener("click", function (e) {
        e.preventDefault();
        goTo(Number(t.getAttribute("data-tick")));
      });
    });

    // ---- keyboard ----
    // Arrows walk the shelf from anywhere on the page.
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (span() < 4) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); goTo(indexNow() + 1); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); goTo(indexNow() - 1); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End") { e.preventDefault(); goTo(plates.length - 1); }
    });
  })();
</script>
</body>
</html>
