<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirrorcore Lab</title>
<meta name="description" content="Mirrorcore Lab. Experiments." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&amp;family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&amp;display=swap" rel="stylesheet" />
<style>
  /* ==================================================================
     MIRRORCORE LAB
     One sheet of warm paper. Near black ink, hairlines, and a great
     deal of nothing. Each experiment is a plate: a quiet drawing, a
     number, a name. The shelf is read left to right against a ruler.
     ================================================================== */

  :root {
    color-scheme: light;

    --paper:  #efece4;
    --ink:    #16150f;
    --ink-2:  rgba(22, 21, 15, 0.54);
    --ink-3:  rgba(22, 21, 15, 0.33);
    --rule:   rgba(22, 21, 15, 0.20);
    --hair:   rgba(22, 21, 15, 0.11);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono:  "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --margin: clamp(1.5rem, 7vw, 7.5rem);
    --plate:  clamp(258px, 26vw, 332px);
    --pad:    clamp(1.4rem, 2.6vw, 2.75rem);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; background: var(--paper); }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: rgba(22, 21, 15, 0.14); }

  a { color: inherit; text-decoration: none; }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 7px; }

  /* ---- masthead ------------------------------------------------- */

  .mast {
    padding: clamp(4.5rem, 15vh, 10rem) var(--margin) 0;
  }

  .mast h1 {
    font-family: var(--serif);
    font-weight: 200;
    font-size: clamp(1.5rem, 3.1vw, 2.5rem);
    letter-spacing: 0.155em;
    text-transform: uppercase;
    line-height: 1;
    text-indent: 0.155em;
  }

  /* ---- section head --------------------------------------------- */

  .work { padding-top: clamp(5.5rem, 20vh, 13rem); }

  .work-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2rem;
    margin: 0 var(--margin);
    padding-bottom: 0.85rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.66rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--ink-2);
    text-indent: 0.34em;
  }

  .steps { display: flex; gap: 0.15rem; margin-right: -0.55rem; }

  .step {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    background: none;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.9rem;
    line-height: 1;
    color: var(--ink);
    opacity: 0.42;
    padding: 0.35rem 0.55rem;
    transition: opacity 0.4s ease;
  }
  .step:hover { opacity: 1; }
  .step:disabled { opacity: 0.13; cursor: default; }

  /* The rule under the head runs to the right edge of the sheet; the
     ruler at the foot stops short. The two lengths make the asymmetry. */
  .work-rule {
    height: 1px;
    background: var(--rule);
    margin-left: var(--margin);
  }

  /* ---- the shelf ------------------------------------------------- */

  .rail {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    scroll-padding-left: var(--margin);
    padding: clamp(2.25rem, 5vh, 3.5rem) var(--margin) 0;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }

  .plate {
    flex: 0 0 var(--plate);
    scroll-snap-align: start;
    padding-left: var(--pad);
    border-left: 1px solid var(--hair);
    display: block;
  }
  /* The first plate hangs flush with the masthead. Its basis drops by the
     padding the others carry, so every drawing is set to one width. */
  .plate:first-child {
    padding-left: 0;
    border-left: 0;
    flex-basis: calc(var(--plate) - var(--pad));
  }

  .figure { color: var(--ink); }
  .figure svg { display: block; width: 100%; height: auto; overflow: visible; }

  .figure-rule {
    height: 1px;
    background: var(--rule);
    margin-top: clamp(1.5rem, 3vh, 2.25rem);
  }

  .label { padding-top: 0.95rem; }

  .idx {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    color: var(--ink-3);
  }

  .name {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(1.3rem, 1.5vw, 1.6rem);
    line-height: 1.12;
    letter-spacing: 0.005em;
    margin-top: 0.7rem;
  }

  .state {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 0.8rem;
  }

  .enter {
    display: inline-flex;
    align-items: baseline;
    gap: 0.85em;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.64rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-top: clamp(1.9rem, 4vh, 2.9rem);
    padding-bottom: 0.42rem;
    position: relative;
    transition: color 0.4s ease;
  }
  .enter::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.55s cubic-bezier(0.22, 0.7, 0.2, 1);
  }
  .arrow { transition: transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1); }

  .plate:hover .enter,
  .plate:focus-visible .enter { color: var(--ink); }
  .plate:hover .enter::after,
  .plate:focus-visible .enter::after { transform: scaleX(1); }
  .plate:hover .arrow,
  .plate:focus-visible .arrow { transform: translateX(0.5em); }

  .is-vacant .name,
  .is-vacant .idx { color: var(--ink-3); }

  /* ---- ruler ----------------------------------------------------- */

  .scale {
    display: flex;
    margin: clamp(2.5rem, 6vh, 4rem) var(--margin) 0;
    border-top: 1px solid var(--rule);
    max-width: 44rem;
  }

  .tick {
    flex: 1 1 0;
    position: relative;
    padding-top: 1.5rem;
    /* four minor divisions inside every unit */
    background-image: repeating-linear-gradient(to right, var(--hair) 0 1px, transparent 1px 25%);
    background-size: 100% 6px;
    background-repeat: no-repeat;
  }
  .tick::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 1px;
    height: 13px;
    background: var(--ink-3);
    transition: height 0.4s ease, background-color 0.4s ease;
  }
  .tick[aria-current]::before { height: 21px; background: var(--ink); }

  .tick-num {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--ink-3);
    transition: color 0.4s ease;
  }
  .tick[aria-current] .tick-num { color: var(--ink); }
  .tick:hover .tick-num { color: var(--ink); }

  footer { height: clamp(3.5rem, 10vh, 7rem); }

  /* ---- drawing ink ----------------------------------------------- */

  .f-line {
    fill: none;
    stroke: currentColor;
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.66;
  }
  .f-soft { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; opacity: 0.34; }
  .f-rule { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.17; }
  .f-dot  { fill: currentColor; stroke: none; opacity: 0.52; }

  /* ---- reveal ---------------------------------------------------- */

  .js .figure {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s cubic-bezier(0.22, 0.7, 0.2, 1);
  }
  .js .is-seen .figure { opacity: 0.92; transform: none; }
  .js .plate:hover .figure { opacity: 1; }

  .js .f-draw {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
  }
  .js .is-seen .f-draw {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1.6s cubic-bezier(0.16, 0.7, 0.24, 1) 0.2s;
  }

  @media (prefers-reduced-motion: reduce) {
    .js .figure { opacity: 0.92; transform: none; transition: none; }
    .js .f-draw { stroke-dashoffset: 0; transition: none; }
    .enter::after, .arrow, .tick::before { transition: none; }
  }

  /* ---- narrow ---------------------------------------------------- */

  @media (max-width: 640px) {
    :root { --plate: 74vw; --pad: 1.35rem; }
    .work { padding-top: clamp(4rem, 14vh, 8rem); }
    .scale { max-width: none; }
  }
</style>
</head>
<body>
<script>document.documentElement.classList.add("js");</script>

  <header class="mast">
    <h1>Mirrorcore Lab</h1>
  </header>

  <main class="work" aria-labelledby="experiments">

            <path class="f-rule" d="M90 117v5 M150 117v5 M230 117v5" />
            <path class="f-line" d="M50 138v16 M70 138v16 M90 138v16 M130 138v16 M150 138v16 M190 138v16 M210 138v16 M230 138v16 M250 138v16" />

<script>
  // Without this file the shelf still works: the plates are links inside a
  // native scroll container and the ruler is a list of anchors.
  (function () {
    "use strict";

    var rail = document.getElementById("rail");
    if (!rail) return;

    var plates = Array.prototype.slice.call(rail.querySelectorAll(".plate"));
    var ticks = Array.prototype.slice.call(document.querySelectorAll(".tick"));
    var steps = Array.prototype.slice.call(document.querySelectorAll(".step"));
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)");

    // ---- ink the drawings once, as they arrive ----
    if ("IntersectionObserver" in window) {
      var seen = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add("is-seen");
          seen.unobserve(e.target);
        });
      }, { threshold: 0.3 });
      plates.forEach(function (p) { seen.observe(p); });
    } else {
      plates.forEach(function (p) { p.classList.add("is-seen"); });
    }

    // ---- position on the ruler ----
    function pitch() {
      if (plates.length < 2) return rail.clientWidth;
      var d = plates[1].offsetLeft - plates[0].offsetLeft;
      return d > 0 ? d : rail.clientWidth;
    }

    var held = null;
    var holdTimer;

    function indexNow() {
      if (held !== null) return held;
      // At the far end the last plate never reaches the left edge, so read
      // the end of the shelf as the last plate rather than the nearest one.
      var max = rail.scrollWidth - rail.clientWidth;
      if (max > 2 && rail.scrollLeft >= max - 2) return plates.length - 1;
      return Math.max(0, Math.min(plates.length - 1, Math.round(rail.scrollLeft / pitch())));
    }

    function mark() {
      var i = indexNow();
      ticks.forEach(function (t, n) {
        if (n === i) t.setAttribute("aria-current", "true");
        else t.removeAttribute("aria-current");
      });
      var max = rail.scrollWidth - rail.clientWidth;
      steps.forEach(function (b) {
        var dir = Number(b.getAttribute("data-step"));
        b.disabled = dir < 0 ? rail.scrollLeft <= 2 : rail.scrollLeft >= max - 2;
      });
    }

    function goTo(i) {
      i = Math.max(0, Math.min(plates.length - 1, i));
      held = i;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(function () { held = null; mark(); }, 700);
      rail.scrollTo({
        left: plates[i].offsetLeft - plates[0].offsetLeft,
        behavior: calm.matches ? "auto" : "smooth"
      });
      mark();
    }

    steps.forEach(function (b) {
      b.addEventListener("click", function () {
        goTo(indexNow() + Number(b.getAttribute("data-step")));
      });
    });

    ticks.forEach(function (t) {
      t.addEventListener("click", function (e) {
        e.preventDefault();
        goTo(Number(t.getAttribute("data-tick")));
      });
    });

    rail.addEventListener("scroll", mark, { passive: true });
    window.addEventListener("resize", mark);
    mark();

    // Arrows move the shelf one plate at a time from anywhere inside it.
    rail.addEventListener("keydown", function (e) {
      if (rail.scrollWidth - rail.clientWidth < 4) return;
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(indexNow() + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(indexNow() - 1); }
      else if (e.key === "Home") { e.preventDefault(); goTo(0); }
      else if (e.key === "End") { e.preventDefault(); goTo(plates.length - 1); }
    });
  })();
</script>
</body>
</html>
