<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirrorcore Lab</title>
<meta name="description" content="Six experiments, kept in one room." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ==================================================================
     MIRRORCORE LAB — the room

     One screen, no scrolling. Six projects are six instruments: two
     working, four cold. The room around them is alive — flame, smoke,
     dust turning in the moonbeam, condensation on the pane — so that
     stillness is what marks a project as suspended. The ledger lying
     open in the near corner is the readable index; the room itself
     stays wordless.

     Something watches from inside the glass. It is never anywhere but
     a reflection, and rarely in the same one twice.

     Scale: .room carries a viewport-derived font-size and everything
     below is in em, so the room grows and shrinks as one object. Each
     instrument's height is --k of a shared --u, so portrait can resize
     all six from a single number.
     ================================================================== */

  :root {
    color-scheme: dark;

    --void:    #060b0a;   /* under the bench, and in the corners */
    --wall:    #0b1312;
    --wall-2:  #121d1a;   /* wall where the moon reaches it */
    --bench:   #171210;   /* old wood: the only warmth in the fabric */
    --bench-2: #241b15;
    --bench-3: #0e0a08;

    --bone:    #e8e2d2;
    --bone-2:  #a79e8a;
    --bone-3:  #6f6859;

    --verd:    #5f9b87;   /* verdigris, the house colour */
    --verd-2:  #2c5549;
    --brass:   #c0984f;
    --moonlt:  #cfe3e6;

    --serif: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --mono:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--serif);
    color: var(--bone);
    background: var(--void);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .skip { position: absolute; left: -9999px; }
  .skip:focus {
    left: 1rem; top: 1rem; z-index: 90;
    padding: 0.5rem 0.8rem;
    font-family: var(--mono); font-size: 0.8rem;
    background: var(--bone); color: var(--void);
  }

  svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---- the room -------------------------------------------------- */

  .room {
    position: relative;
    height: 100dvh;
    /* the single scale knob; height-led, so the room always fits */
    font-size: clamp(8px, min(1.05vw, 1.35vh), 15px);
    --u: 1em;               /* the unit every instrument is cut from */
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 1fr auto auto;
    overflow: hidden;
    background:
      radial-gradient(70% 55% at 78% 6%, rgba(207,227,230,0.10), transparent 62%),
      radial-gradient(120% 90% at 50% 120%, var(--void), transparent 55%),
      linear-gradient(to bottom, var(--wall-2) 0%, var(--wall) 46%, #080f0e 100%);
  }

  /* a slow swell in the light, as if a flame somewhere is working */
  .room::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(45% 40% at 20% 76%, rgba(192,152,79,0.07), transparent 70%);
  }
  @media (prefers-reduced-motion: no-preference) {
    .room::after { animation: swell 7s ease-in-out infinite; }
  }
  @keyframes swell { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* ---- the window, and the moon in it ---------------------------- */

  .wall, .bench { position: relative; min-width: 0; }

  .casement {
    position: absolute;
    right: 7%; top: 8%;
    width: 19em; height: 21em;
    border: 0.5em solid #0a100f;
    border-radius: 0.3em 0.3em 0 0;
    background: linear-gradient(170deg, #142028 0%, #0c1419 60%, #091012 100%);
    box-shadow: 0 0 5em rgba(207,227,230,0.09), inset 0 0 2em rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .casement .bars {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, transparent calc(50% - 0.2em), #0a100f calc(50% - 0.2em), #0a100f calc(50% + 0.2em), transparent calc(50% + 0.2em)),
      linear-gradient(to bottom, transparent calc(42% - 0.2em), #0a100f calc(42% - 0.2em), #0a100f calc(42% + 0.2em), transparent calc(42% + 0.2em));
  }
  .casement .moon {
    position: absolute; left: 21%; top: 12%;
    width: 6em; height: 6em;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #f2f6f4, #cfe3e6 58%, #93aeb2 100%);
    box-shadow: 0 0 2.4em rgba(207,227,230,0.55), 0 0 7em rgba(207,227,230,0.22);
  }
  /* condensation, running down the inside of the pane now and then */
  .casement .bead {
    position: absolute; left: 68%; top: 10%;
    width: 0.42em; height: 0.72em;
    border-radius: 50% 50% 55% 55%;
    background: rgba(207,227,230,0.5);
    opacity: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .casement .bead { animation: run 13s linear infinite; }
    .casement .bead.b2 { left: 33%; top: 52%; animation-duration: 19s; animation-delay: 6s; }
  }
  @keyframes run {
    0%       { opacity: 0;   transform: translateY(0); }
    6%       { opacity: 0.8; }
    78%      { opacity: 0.5; transform: translateY(11em); }
    86%,100% { opacity: 0;   transform: translateY(12em); }
  }

  /* ---- the light, laid over the whole room ----------------------- */

  /* the shaft from the window, which has to fall across the bench and
     so lives above it rather than inside the wall */
  .beam {
    position: absolute;
    right: 9%; top: 9%;
    z-index: 4;
    width: 46em; height: 62em;
    pointer-events: none;
    background: linear-gradient(197deg, rgba(207,227,230,0.14) 0%, rgba(207,227,230,0.05) 42%, transparent 72%);
    clip-path: polygon(62% 0%, 92% 0%, 46% 100%, 2% 100%);
    mix-blend-mode: screen;
    filter: blur(0.3em);
  }
  @media (prefers-reduced-motion: no-preference) {
    .beam { animation: swell 11s ease-in-out infinite; }
  }

  /* dust turning over inside the beam */
  /* the same box and the same cut as the beam, so dust only ever turns
     over where there is light to catch it */
  .motes {
    position: absolute;
    right: 9%; top: 9%;
    z-index: 5;
    width: 46em; height: 62em;
    pointer-events: none;
    clip-path: polygon(62% 0%, 92% 0%, 46% 100%, 2% 100%);
  }
  .motes i {
    position: absolute;
    width: 0.2em; height: 0.2em;
    border-radius: 50%;
    background: var(--moonlt);
    opacity: 0.3;
  }
  @media (prefers-reduced-motion: no-preference) {
    .motes i { animation: drift 16s ease-in-out infinite; }
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0);        opacity: 0.1; }
    35%     { transform: translate(-1.4em,3em); opacity: 0.5; }
    70%     { transform: translate(0.8em,7em);  opacity: 0.22; }
  }

  /* ---- wall furniture -------------------------------------------- */

  .chart, .hanging { position: absolute; pointer-events: none; line-height: 0; }
  .chart   { left: 41%; bottom: 26%; width: 10em; }
  .chart svg, .hanging svg { display: block; width: 100%; height: auto; }
  .hanging { left: 47%; top: 0;   width: 8em; }

  /* dried things move a little, because everything in here does */
  @media (prefers-reduced-motion: no-preference) {
    .sprigs { transform-box: fill-box; transform-origin: 50% 0; animation: sway 11s ease-in-out infinite; }
  }
  @keyframes sway {
    0%,100% { transform: rotate(-0.7deg); }
    50%     { transform: rotate(0.9deg); }
  }

  /* ---- props: things that fill a working room but do nothing ----- */

  .prop { line-height: 0; align-self: flex-end; pointer-events: none; }
  .prop svg {
    display: block;
    height: calc(var(--k) * var(--u));
    width: auto;
    filter: drop-shadow(0 0.4em 0.6em rgba(0,0,0,0.6)) saturate(0.55) brightness(0.88);
  }

  /* ---- the shelf ------------------------------------------------- */

  .shelf {
    position: absolute;
    left: 6%; bottom: 4%;
    width: 39em;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 1em;
  }
  /* the upper shelf, which is all stock and no experiment */
  .shelf.high {
    left: 5%; bottom: auto; top: 7%;
    width: 25em;
    justify-content: flex-start;
    gap: 0.9em;
    padding-left: 1em;
  }
  .shelf::after {
    content: "";
    position: absolute; left: -1.5em; right: -1.5em; bottom: -1.1em;
    height: 1.1em;
    background: linear-gradient(to bottom, var(--bench-2), var(--bench-3));
    box-shadow: 0 0.5em 1.6em rgba(0,0,0,0.75);
    border-radius: 0.1em;
  }

  /* ---- the bench ------------------------------------------------- */

  .bench-top {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    gap: clamp(0.4em, 1.5vw, 2.6em);
    padding: 0 0 0.4em 5%;
    min-height: 21em;
  }
  /* the near edge of the work surface, catching what light there is */
  .bench-face {
    height: 3.4em;
    background: linear-gradient(to bottom, var(--bench-2) 0%, var(--bench) 35%, var(--bench-3) 100%);
    box-shadow: inset 0 0.14em 0 rgba(232,226,210,0.16), 0 1.4em 3em rgba(0,0,0,0.85);
  }
  .floor {
    height: 5em;
    background: linear-gradient(to bottom, #090e0d, var(--void));
  }

  /* ---- an instrument -------------------------------------------- */

  .instr {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    line-height: 0;
    border-radius: 0.2em;
  }
  /* what the instrument spills onto the surface it stands on. Without
     this they float; with it they have weight. */
  .instr::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -0.5em;
    width: 125%; height: 1.5em;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, var(--reagent), transparent 68%);
    opacity: 0.22;
    filter: blur(0.35em);
    pointer-events: none;
    transition: opacity 420ms ease;
  }
  .instr.off::after { opacity: 0.07; }
  .instr:hover::after,
  .instr:focus-visible::after,
  .instr.near::after { opacity: 0.34; }

  .instr .art {
    display: block;
    height: calc(var(--k) * var(--u));
    width: auto;
    overflow: visible;
    filter: drop-shadow(0 0.5em 0.7em rgba(0,0,0,0.6));
    transition: filter 420ms ease, transform 420ms ease;
  }

  .instr:focus { outline: none; }
  .instr:focus-visible { outline: 1px solid var(--reagent); outline-offset: 0.6em; }

  /* glass, metal, wood */
  .glass  { fill: rgba(207,227,230,0.06); stroke: rgba(207,227,230,0.40); stroke-width: 0.9; }
  .glass-d{ fill: rgba(207,227,230,0.03);  stroke: rgba(207,227,230,0.24); stroke-width: 0.9; }
  .metal  { fill: var(--verd-2); stroke: var(--verd); stroke-width: 0.8; }
  .brassy { fill: #6d5526; stroke: var(--brass); stroke-width: 0.9; }
  .cork   { fill: #4a3a28; stroke: #6b5538; stroke-width: 0.8; }
  .hair   { fill: none; stroke: rgba(207,227,230,0.26); stroke-width: 0.7; }
  .hair-f { fill: none; stroke: rgba(207,227,230,0.22); stroke-width: 0.6; }
  .ink    { fill: var(--void); }

  /* the contents, which is where the light comes from */
  .fluid { fill: var(--reagent); opacity: 0.42; }
  .lit   { fill: var(--reagent); opacity: 0.9; }
  .aura  { fill: var(--reagent); opacity: 0.2; filter: blur(2.2px); }

  /* a working instrument carries its own light */
  .instr.on .art { filter: drop-shadow(0 0.5em 0.7em rgba(0,0,0,0.6)) drop-shadow(0 0 1.1em var(--reagent)); }
  .instr.on .fluid { opacity: 0.55; }

  /* a suspended one has gone cold, and the dust has settled on it */
  .instr.off .fluid { opacity: 0.2; }
  .instr.off .aura  { opacity: 0.05; }
  .instr.off .lit   { opacity: 0.4; }
  .instr.off .art   { filter: drop-shadow(0 0.5em 0.7em rgba(0,0,0,0.6)) saturate(0.55) brightness(0.92); }
  .dust { fill: none; stroke: rgba(232,226,210,0.3); stroke-width: 1.1; stroke-linecap: round; display: none; }
  .instr.off .dust { display: block; }

  /* approaching one wakes it a little, cold or not. .near is set from
     the ledger, so a line and its instrument light together. */
  .instr:hover .art,
  .instr:focus-visible .art,
  .instr.near .art {
    transform: translateY(-0.35em);
    filter: drop-shadow(0 0.5em 0.7em rgba(0,0,0,0.6)) drop-shadow(0 0 1.4em var(--reagent)) saturate(1);
  }
  .instr:hover .fluid,
  .instr:focus-visible .fluid,
  .instr.near .fluid { opacity: 0.62; }

  /* ---- what moves, and only where it should ---------------------- */

  .swirl, .corona, .flame { transform-box: fill-box; transform-origin: center; }
  /* mist, not a shape floating in a jar */
  .swirl { filter: blur(2.6px); }
  .flame { transform-origin: 50% 100%; }

  @media (prefers-reduced-motion: no-preference) {
    /* the globe never stops turning over */
    .instr.on .swirl { animation: swirl 26s linear infinite; }
    /* the leaf's corona, breathing */
    .instr.on .corona { animation: corona 3.4s ease-in-out infinite; }
    /* and the arc across the electrodes, which stutters */
    .instr.on .arc { animation: arc 2.6s steps(1, end) infinite; }
    /* air leaving the bell */
    .instr.on .bub { animation: bub 4.6s ease-in infinite; }
    .instr.on .bub.b2 { animation-delay: 1.5s; animation-duration: 5.4s; }
    .instr.on .bub.b3 { animation-delay: 3.1s; animation-duration: 3.9s; }
  }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes corona { 0%,100% { opacity: 0.16; transform: scale(0.94); } 50% { opacity: 0.4; transform: scale(1.06); } }
  @keyframes arc    { 0%,42% { opacity: 0.15; } 46%,54% { opacity: 1; } 58%,100% { opacity: 0.25; } }
  @keyframes bub    { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 0.75; } 100% { transform: translateY(-11px) scale(1); opacity: 0; } }

  /* ---- the candle, and the censer beside it ---------------------- */

  .flame-wrap { position: relative; line-height: 0; align-self: flex-end; }
  .flame-wrap .halo {
    position: absolute; left: 50%; bottom: 26%;
    width: 13em; height: 13em; margin-left: -6.5em;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(226,170,84,0.3), rgba(226,170,84,0.08) 40%, transparent 72%);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .flame { animation: flicker 1.9s ease-in-out infinite; }
    .flame-wrap .halo { animation: flicker 1.9s ease-in-out infinite; }
    .smoke { animation: rise 9s linear infinite; }
    .smoke.s2 { animation-delay: 3s; }
    .smoke.s3 { animation-delay: 6s; }
  }
  @keyframes flicker {
    0%,100% { transform: scale(1,1)       translateX(0);     opacity: 0.92; }
    28%     { transform: scale(0.92,1.1)  translateX(-0.4px);opacity: 1; }
    54%     { transform: scale(1.05,0.93) translateX(0.3px); opacity: 0.84; }
    76%     { transform: scale(0.96,1.05) translateX(0.2px); opacity: 1; }
  }
  @keyframes rise {
    0%   { transform: translate(0,0) scale(0.5);        opacity: 0; }
    15%  { opacity: 0.3; }
    100% { transform: translate(-7px,-34px) scale(2.4); opacity: 0; }
  }

  /* ---- the thing in the glass ------------------------------------ */

  .wraith {
    opacity: 0;
    mix-blend-mode: screen;
    filter: blur(1.6px);
    transition: opacity 2600ms ease-in-out;
    pointer-events: none;
  }
  .haunted .wraith { opacity: 0.22; }

  /* ---- the ledger ------------------------------------------------ */

  /* An open book: two leaves splayed back from a dark gutter, with the
     block of pages showing its thickness at the outer edges. */
  .ledger {
    position: absolute;
    right: 3%; bottom: 1.4em;
    z-index: 6;
    width: 32em;
    display: flex;
    align-items: stretch;
    transform: rotate(-0.6deg);
    filter: drop-shadow(0 1.1em 1.8em rgba(0,0,0,0.85));
  }
  .page {
    position: relative;
    padding: 1.5em 1.6em 1.7em;
    background: linear-gradient(to bottom, #272116 0%, #221d14 55%, #1b1710 100%);
    border: 1px solid rgba(232,226,210,0.2);
    box-shadow: inset 0 0 2.5em rgba(0,0,0,0.35);
  }
  .page.l {
    flex: 0 0 41%;
    border-right: 0;
    border-radius: 0.45em 0 0 0.45em;
    transform: perspective(70em) rotateY(-6deg);
    transform-origin: right center;
  }
  .page.r {
    flex: 1;
    border-left: 0;
    border-radius: 0 0.45em 0.45em 0;
    transform: perspective(70em) rotateY(6deg);
    transform-origin: left center;
  }
  /* the gutter, where the paper turns down into the spine */
  .page::after {
    content: "";
    position: absolute; top: 0; bottom: 0;
    width: 2.4em;
    pointer-events: none;
  }
  .page.l::after { right: 0; background: linear-gradient(to right, transparent, rgba(0,0,0,0.55)); }
  .page.r::after { left: 0;  background: linear-gradient(to left,  transparent, rgba(0,0,0,0.55)); }
  /* the cut edge of the leaves underneath */
  .page::before {
    content: "";
    position: absolute; top: 0.45em; bottom: 0.45em;
    width: 0.45em;
    background: repeating-linear-gradient(to right, rgba(232,226,210,0.16) 0 1px, rgba(0,0,0,0.25) 1px 2px);
  }
  .page.l::before { left: -0.45em;  border-radius: 0.4em 0 0 0.4em; }
  .page.r::before { right: -0.45em; border-radius: 0 0.4em 0.4em 0; }

  .ledger h1 {
    font-weight: 400;
    font-size: 2em;
    line-height: 1.05;
  }
  .ledger .sub {
    font-family: var(--mono);
    font-size: 0.78em;
    line-height: 1.55;
    color: #8e8674;
    margin-top: 0.8em;
  }
  .ledger .flourish {
    margin-top: 1em;
    width: 7em; height: 1px;
    background: linear-gradient(to right, var(--verd), transparent);
  }

  .ledger ol { list-style: none; }

  .line {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    padding: 0.3em 0.5em 0.3em 0.6em;
    text-decoration: none;
    color: var(--bone-2);
    border-left: 1px solid transparent;
    border-radius: 0.1em;
    transition: color 240ms ease, border-color 240ms ease, background 240ms ease;
  }
  .line .nm { font-size: 1.12em; }
  .line .st {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 0.64em;
    color: #8e8674;
    white-space: nowrap;
  }
  .line .mark {
    width: 0.45em; height: 0.45em;
    border-radius: 50%;
    background: var(--reagent);
    opacity: 0.45;
    flex: none;
  }
  .line[data-state="suspended"] .mark { border-radius: 0; height: 1px; opacity: 0.5; }

  /* hovering either the line or its instrument lights both */
  .line:hover, .line:focus-visible, .line.lit {
    color: var(--bone);
    border-left-color: var(--reagent);
    background: rgba(232,226,210,0.05);
  }
  .line:hover .mark, .line:focus-visible .mark, .line.lit .mark { opacity: 1; }
  .line:focus { outline: none; }
  .line:focus-visible { outline: 1px solid var(--reagent); outline-offset: 0.15em; }

  /* ---- portrait: the same room, stacked -------------------------- */

  @media (max-aspect-ratio: 9/10) {
    .room {
      font-size: clamp(7px, 2.8vw, 14px);
      --u: 0.5em;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      align-content: start;
    }
    .wall { display: flex; flex-direction: column; align-items: center; padding-top: 1.4em; }
    .casement { position: relative; right: auto; top: auto; width: 15em; height: 16em; }
    /* no room on a phone wall for the chart or the hanging bunch */
    .chart, .hanging { display: none; }
    .shelf {
      position: relative;
      left: auto; bottom: auto;
      width: 86%;
      margin-top: 2.2em;
      padding: 0;
      justify-content: space-around;
    }
    .shelf::after { left: -0.8em; right: -0.8em; }
    .beam  { right: -6em; top: 0;   width: 32em; height: 42em; }
    .motes { right: -6em; top: 0;   width: 32em; height: 42em; }
    /* two by two, so nothing can push past the edge */
    .bench-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      justify-items: center;
      align-items: end;
      gap: 1.2em 0.6em;
      min-height: 0;
      padding: 2em 5% 0.5em;
    }
    .flame-wrap, .prop { display: none; }
    .shelf.high { display: none; }
    .bench-top .instr:last-of-type { grid-column: 1 / -1; }
    .floor { grid-row: 4; height: auto; min-height: 2.5em; }
    /* a phone has no room for two leaves side by side, so the book
       folds the other way: title leaf above, list leaf below */
    .ledger {
      position: static;
      grid-row: 3;
      width: auto;
      margin: 1.2em 5% 1.4em;
      transform: none;
      flex-direction: column;
    }
    .page { padding: 1em 1.2em; border: 1px solid rgba(232,226,210,0.2); transform: none; }
    .page.l { flex: none; border-bottom: 0; border-radius: 0.45em 0.45em 0 0; padding-bottom: 0.9em; }
    .page.r { border-top: 0; border-radius: 0 0 0.45em 0.45em; }
    .page::before { display: none; }
    .page::after { left: 0; right: 0; width: auto; height: 1.3em; }
    .page.l::after { top: auto; bottom: 0; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.5)); }

  }

  @media (max-height: 430px) {

<script>
  /* The room works with this file absent: the instruments and the ledger
     are ordinary links, and the watcher stays in whichever glass it was
     first drawn into. Everything below is refinement on top of that. */
  (function () {
    "use strict";

    var calm = window.matchMedia("(prefers-reduced-motion: reduce)");

    /* ---- the ledger and the room answer for each other ---- */

    var lines = Array.prototype.slice.call(document.querySelectorAll(".line"));
    var instrs = Array.prototype.slice.call(document.querySelectorAll(".instr[data-key]"));

    function pair(key, on) {
      lines.forEach(function (l) {
        if (l.getAttribute("data-key") === key) l.classList.toggle("lit", on);
      });
      instrs.forEach(function (i) {
        if (i.getAttribute("data-key") === key) i.classList.toggle("near", on);
      });
    }

    instrs.concat(lines).forEach(function (el) {
      var key = el.getAttribute("data-key");
      el.addEventListener("mouseenter", function () { pair(key, true); });
      el.addEventListener("focus", function () { pair(key, true); });
      el.addEventListener("mouseleave", function () { pair(key, false); });
      el.addEventListener("blur", function () { pair(key, false); });
    });

    /* ---- the watcher ----
       In the glass from the moment the page opens. It moves, and it does
       not often come back to the same vessel: the last two hosts are
       kept out of the draw. */

    var hosts = Array.prototype.slice.call(document.querySelectorAll(".wraith"))
      .map(function (w) { return w.closest(".instr") || w.closest(".casement"); })
      .filter(Boolean);

    if (!hosts.length) return;

    var recent = [];

    function clearAll() {
      hosts.forEach(function (h) { h.classList.remove("haunted"); });
    }
    function draw() {
      var pool = hosts.filter(function (h) { return recent.indexOf(h) === -1; });
      if (!pool.length) pool = hosts;
      var h = pool[Math.floor(Math.random() * pool.length)];
      recent.push(h);
      while (recent.length > 2) recent.shift();
      return h;
    }

    draw().classList.add("haunted");
    if (calm.matches) return;

    /* gone for a moment, then somewhere else */
    setInterval(function () {
      clearAll();
      setTimeout(function () { draw().classList.add("haunted"); }, 3000);
    }, 13000);
  })();
</script>
