<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirrorcore Lab</title>
<meta name="description" content="Experiments in progress." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<style>
  /* ==================================================================
     MIRRORCORE LAB — index

     Six names on a dark surface, nothing explained. At rest the page is
     grey. Colour is attention, not status: the name under the lens
     lights in its own hue and throws a short reflection, which is the
     whole of the decoration and the reason for the name of the lab.
     Running badges are the exception that stay lit.
     No script: every state here is hover, focus or :target.
     ================================================================== */

  :root {
    color-scheme: dark;

    --ink:    #090c0f;   /* the surface */
    --line:   #1b2126;   /* hairline between entries */
    --dim:    #59636b;   /* dormant text */
    --bone:   #e9e6df;   /* full light */

    --gutter: clamp(1.4rem, 7vw, 7rem);
    --name:   clamp(1.3rem, 3.6vw, 2.05rem);
    --small:  clamp(0.72rem, 0.3vw + 0.66rem, 0.79rem);

    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; background: var(--ink); }

  body {
    font-family: var(--mono);
    font-size: var(--small);
    line-height: 1.65;
    color: var(--bone);
    background-color: var(--ink);
    /* One light source, high and to the left. The list walks away from it. */
    background-image:
      radial-gradient(135% 75% at 10% -15%, rgba(233,230,223,0.055), transparent 58%);
    background-repeat: no-repeat;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .skip { position: absolute; left: -9999px; }
  .skip:focus {
    left: var(--gutter);
    top: 0.6rem;
    z-index: 5;
    padding: 0.4rem 0.7rem;
    background: var(--bone);
    color: var(--ink);
  }

  main {
    max-width: 46rem;
    padding: clamp(3.5rem, 13vh, 9rem) var(--gutter) clamp(4rem, 14vh, 9rem);
  }

  /* ---- masthead ------------------------------------------------- */

  .masthead { margin-bottom: clamp(3rem, 11vh, 7rem); }

  .lab {
    font-size: clamp(0.86rem, 0.3vw + 0.78rem, 0.97rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--bone);
  }


  /* ---- the index ------------------------------------------------ */

  .index { border-top: 1px solid var(--line); }

  .entry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: clamp(1rem, 4vw, 2.5rem);
    align-items: baseline;
    padding: clamp(1.4rem, 3.8vh, 2.1rem) 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
    position: relative;
  }

  /* The left edge of the entry being read, in the entry's own colour. */
  .entry::before {
    content: "";
    position: absolute;
    left: calc(var(--gutter) * -0.42);
    top: clamp(1.4rem, 3.8vh, 2.1rem);
    width: 1px;
    height: 0;
    background: var(--accent, var(--bone));
    transition: height 320ms ease;
  }

  .name {
    position: relative;
    font-size: var(--name);
    font-weight: 400;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--dim);
    padding-bottom: 0.5em;
    transition: color 280ms ease;
  }

  /* The reflection: mirrored, dropped just under the glyphs, and gone
     again within half a line. Visible only on the live entry. */
  .reflect {
    position: absolute;
    left: 0;
    top: calc(100% - 0.5em);
    white-space: nowrap;
    transform: scaleY(-1);
    opacity: 0;
    color: var(--accent, var(--bone));
    filter: blur(0.5px);
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 52%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 52%, #000 100%);
    transition: opacity 320ms ease;
  }

  /* ---- badges --------------------------------------------------- */

  .state {
    justify-self: end;
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    padding: 0.22em 0.6em;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: var(--small);
    line-height: 1.5;
    color: var(--dim);
    white-space: nowrap;
    transition: color 280ms ease, border-color 280ms ease;
  }

  /* Suspended reads as a flatline. */
  .state[data-state="suspended"]::before {
    content: "";
    width: 0.55em;
    height: 1px;
    background: currentColor;
  }

  /* A running experiment keeps its colour whether read or not. */
  .state[data-state="running"] {
    border-color: color-mix(in srgb, var(--accent) 34%, transparent);
    color: var(--accent);
  }
  .state[data-state="running"]::before {
    content: "";
    width: 0.45em;
    height: 0.45em;
    border-radius: 50%;
    background: currentColor;
    animation: breathe 4.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  /* ---- under the lens ------------------------------------------- */

  .entry:hover .name,
  .entry:focus-visible .name,
  .entry:target .name { color: var(--accent, var(--bone)); }

  .entry:hover .reflect,
  .entry:focus-visible .reflect,
  .entry:target .reflect { opacity: 0.2; }

  .entry:hover::before,
  .entry:focus-visible::before,
  .entry:target::before { height: 1.1em; }

  .entry:hover .state[data-state="suspended"],
  .entry:focus-visible .state[data-state="suspended"],
  .entry:target .state[data-state="suspended"] {
    color: color-mix(in srgb, var(--accent) 70%, var(--bone));
    border-color: color-mix(in srgb, var(--accent) 28%, transparent);
  }

  .entry:focus { outline: none; }
  .entry:focus-visible {
    outline: 1px solid var(--accent, var(--bone));
    outline-offset: clamp(0.5rem, 2vw, 1.1rem);
  }


  /* ---- narrow --------------------------------------------------- */

  @media (max-width: 34rem) {
    .entry { grid-template-columns: minmax(0, 1fr); }
    .state { grid-row: 1; justify-self: start; }
    .name  { grid-row: 2; margin-top: 0.7rem; }
    .entry::before { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .state[data-state="running"]::before { opacity: 1; }
  }
</style>
</head>
<body>
  <a class="skip" href="#index">Skip to the index</a>

  <main>
    <header class="masthead">
      <h1 class="lab">Mirrorcore Lab</h1>
    </header>

    <nav class="index" id="index" aria-label="Experiments">

      <a class="entry" id="dream-archive" href="Dream-Archive/index.html" style="--accent:#9b93dd">
        <h2 class="name">Dream Archive<span class="reflect" aria-hidden="true">Dream Archive</span></h2>
        <span class="state" data-state="running">running</span>
      </a>

      <a class="entry" id="bioelectric" href="Bioelectric-studio/index.html" style="--accent:#9d84f0">
        <h2 class="name">Bioelectric Studio<span class="reflect" aria-hidden="true">Bioelectric Studio</span></h2>
        <span class="state" data-state="running">running</span>
      </a>

      <a class="entry" id="daily-flow" href="Daily-Flow/index.html" style="--accent:#5fc8a6">
        <h2 class="name">Daily Flow<span class="reflect" aria-hidden="true">Daily Flow</span></h2>
        <span class="state" data-state="suspended">suspended</span>
      </a>

      <a class="entry" id="local-species" href="Local-Species/index.html" style="--accent:#85c95f">
        <h2 class="name">Local Species<span class="reflect" aria-hidden="true">Local Species</span></h2>
        <span class="state" data-state="suspended">suspended</span>
      </a>

      <a class="entry" id="quest-omen" href="Quest-Omen/index.html" style="--accent:#e0ab3d">
        <h2 class="name">Quest Omen<span class="reflect" aria-hidden="true">Quest Omen</span></h2>
        <span class="state" data-state="suspended">suspended</span>
      </a>

      <a class="entry" id="time-scroller" href="Time-Scroller/index.html" style="--accent:#ef8055">
        <h2 class="name">Time Scroller<span class="reflect" aria-hidden="true">Time Scroller</span></h2>
        <span class="state" data-state="suspended">suspended</span>
      </a>

    </nav>
  </main>
</body>
</html>
