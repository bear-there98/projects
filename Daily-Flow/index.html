              ))}
            </div>
            <p style={{ fontSize: 12.5, color: INK_SOFT, margin: "10px 0 0" }}>A day counts toward a streak when everything scheduled that day is done.</p>
          </Section>

          <Section title="Why tasks were skipped" info="How often each skip reason came up in this period. Spotting the common ones helps you see what tends to get in the way.">
            {skipCounts.length === 0 ? (
              <p style={{ fontSize: 15, color: INK_SOFT, margin: 0 }}>No skips in this period.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
                {skipCounts.map(([reason, n]) => (
                  <div key={reason} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ flex: 1, fontSize: 15.5, fontWeight: 600 }}>{reason}</span>
                    <div style={{ width: 110, height: 8, background: INK + "14", borderRadius: 99 }}>
                      <div style={{ width: `${Math.min((n / skipCounts[0][1]) * 100, 100)}%`, height: "100%", background: BRAND, opacity: 0.4 + 0.6 * (n / skipCounts[0][1]), borderRadius: 99 }} />
                    </div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: INK_SOFT, width: 26, textAlign: "right" }}>{n}×</span>
                  </div>
                ))}
              </div>
            )}
          </Section>

          <Section title="By task" info="How often you completed each task out of the days it was scheduled in this period. Personal covers every area except Household.">
            {taskStats.length === 0 ? (
              <p style={{ fontSize: 15, color: INK_SOFT, margin: 0 }}>Nothing scheduled in this period yet.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                <div>
                  <GroupLabel>Personal</GroupLabel>
                  {personalTasks.length === 0 ? (
                    <p style={{ fontSize: 14, color: INK_SOFT, margin: 0 }}>Nothing scheduled here yet.</p>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>{personalTasks.map(taskStatRow)}</div>
                  )}
                </div>
                {hasHousehold && (
                  <div>
                    <GroupLabel>Household</GroupLabel>
                    {householdTasks.length === 0 ? (
                      <p style={{ fontSize: 14, color: INK_SOFT, margin: 0 }}>Nothing scheduled here yet.</p>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>{householdTasks.map(taskStatRow)}</div>
                    )}
                  </div>
                )}
              </div>
            )}
          </Section>

          {hasPriorities && (
            <Section title="Priority" info="Completion rate for tasks you flagged by priority, so you can see whether the ones that matter most actually get done.">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                {PRIORITY_LEVELS.map((q) => {
                  const { s, d } = matrix[q.key];
                  const pct = s ? Math.round((d / s) * 100) : null;
                  return (
                    <div key={q.key} style={{ borderRadius: 12, border: `1px solid ${LINE}`, background: "#FFFFFF", padding: "13px 12px" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: INK }}>{q.label}</div>
                      <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 8 }}>{q.hint}</div>
                      {s === 0 ? (
                        <div style={{ fontSize: 13.5, color: INK_SOFT }}>none scheduled</div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "baseline", gap: 6, flexWrap: "wrap" }}>
                          <span className="df-display df-num" style={{ fontSize: 26, fontWeight: 600, color: INK }}>{pct}%</span>
                          <span style={{ fontSize: 12, color: INK_SOFT }}>{d}/{s} done</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <p style={{ fontSize: 12.5, color: INK_SOFT, margin: "10px 0 0" }}>Completion rate by priority, last {range} days.</p>
            </Section>
          )}

          <Section title="Rewards" info="Points you have available to spend, plus anything you redeemed in this period. You earn a point for each task you finish.">
            <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: redemptions.length ? 14 : 0 }}>
              <span className="df-display df-num" style={{ fontSize: 28, fontWeight: 600 }}>{pointsBalance(data)}</span>
              <span style={{ fontSize: 14.5, color: INK_SOFT }}>points to spend</span>
            </div>
            {redemptions.length === 0 ? (
              <p style={{ fontSize: 15, color: INK_SOFT, margin: 0 }}>No rewards redeemed in this period.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {redemptions.map((r, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <Star size={14} color="#8F6E22" />
                    <span style={{ flex: 1, fontSize: 15.5, fontWeight: 600 }}>{r.name}</span>
                    <span style={{ fontSize: 13.5, color: INK_SOFT }}>{r.date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
                    <span style={{ fontSize: 14, fontWeight: 700, color: INK_SOFT, width: 40, textAlign: "right" }}>−{r.cost}</span>
                  </div>
                ))}
              </div>
            )}
          </Section>
        </div>
      </div>
    </div>
  );
}

/* ————— Manage ————— */
function ManageView({ data, persist, nav, onSwitchProfile }) {
  const [editingId, setEditingId] = useState(null);
  const [addingCat, setAddingCat] = useState(false);
  const [newCat, setNewCat] = useState("");
  const [addingTask, setAddingTask] = useState(false);
  const [ioMsg, setIoMsg] = useState(null);
  const [newRewardName, setNewRewardName] = useState("");
  const [newRewardCost, setNewRewardCost] = useState("");
  const [newExName, setNewExName] = useState("");
  const [newExPart, setNewExPart] = useState(BODY_PARTS[0]);
  const [newExReps, setNewExReps] = useState("");
  const [newExNote, setNewExNote] = useState("");
  const fileRef = useRef(null);
  const whySeen = data.settings?.whySeen || [];
  const markWhySeen = (id) => persist({ ...data, settings: { ...(data.settings || {}), whySeen: [...whySeen, id] } });
  const setSetting = (patch) => persist({ ...data, settings: { ...(data.settings || {}), ...patch } });
  const toggleVacation = () => {
    const on = !(data.settings && data.settings.vacation);
    const vd = new Set(data.settings?.vacationDays || []);
    if (on) vd.add(todayKey());
    setSetting({ vacation: on, vacationDays: [...vd] });
  };

  const library = effectiveLibrary(data);

  const addWorkoutSplit = () => {
    let categories = data.categories;
    let body = categories.find((c) => c.name === "Body");
    if (!body) {
      body = { id: uid(), name: "Body", color: CAT_COLORS[categories.length % CAT_COLORS.length].color };
      categories = [...categories, body];
    }
    persist({ ...data, categories, tasks: [...data.tasks, ...makeWorkoutSplit(library, body.id)] });
  };
  const addHouseholdBasics = () => {
    const { categories, id } = ensureHouseholdCategory(data.categories);
    persist({ ...data, categories, tasks: [...data.tasks, ...makeHouseholdTasks(id)] });
  };

  const setOverrides = (next) => persist({ ...data, libraryOverrides: next });
  const editExercise = (ex, field, value) => {
    const ov = { ...(data.libraryOverrides || {}) };
    if (ex._added) {
      ov.added = (ov.added || []).map((a) => (a.id === ex.id ? { ...a, [field]: value } : a));
    } else {
      ov.edits = { ...(ov.edits || {}), [ex._base]: { ...((ov.edits || {})[ex._base] || {}), [field]: value } };
    }
    setOverrides(ov);
  };
  const deleteExercise = (ex) => {
    const ov = { ...(data.libraryOverrides || {}) };
    if (ex._added) {
      ov.added = (ov.added || []).filter((a) => a.id !== ex.id);
    } else {
      ov.deleted = [...new Set([...(ov.deleted || []), ex._base])];
      if (ov.edits) { const e = { ...ov.edits }; delete e[ex._base]; ov.edits = e; }
    }
    setOverrides(ov);
  };
  const resetExercise = (ex) => {
    const ov = { ...(data.libraryOverrides || {}) };
    if (ov.edits) { const e = { ...ov.edits }; delete e[ex._base]; ov.edits = e; }
    ov.deleted = (ov.deleted || []).filter((n) => n !== ex._base);
    setOverrides(ov);
  };
  const addExercise = () => {
    const name = newExName.trim();
    if (!name) return;
    const ov = { ...(data.libraryOverrides || {}) };
    ov.added = [...(ov.added || []), { id: uid(), name, bodyPart: newExPart, defaultReps: newExReps.trim() || "3×10", note: newExNote.trim() }];
    setOverrides(ov);
    setNewExName(""); setNewExReps(""); setNewExNote("");
  };

  const addReward = () => {
    const name = newRewardName.trim();
    const cost = Math.max(1, Math.round(Number(newRewardCost) || 0));
    if (!name || !(cost > 0)) return;
    persist({ ...data, rewards: [...(data.rewards || []), { id: uid(), name, cost }] });
    setNewRewardName(""); setNewRewardCost("");
  };
  const updateReward = (id, patch) => persist({ ...data, rewards: (data.rewards || []).map((r) => (r.id === id ? { ...r, ...patch } : r)) });
  const removeReward = (id) => persist({ ...data, rewards: (data.rewards || []).filter((r) => r.id !== id) });

  const exportProfile = () => {
    try {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const safe = (data.name || "profile").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
      const a = document.createElement("a");
      a.href = url;
      a.download = `daily-flow-${safe}-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setIoMsg("Backup downloaded.");
    } catch (e) { setIoMsg("Export failed."); }
  };

  const importProfile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const next = migrate(parsed);
        if (!next || typeof next !== "object" || !Array.isArray(next.tasks)) {
          setIoMsg("That file doesn't look like a Daily Flow backup.");
          return;
        }
        if (!window.confirm("Replace this profile's tasks and history with the imported backup?")) return;
        persist({ ...next, name: data.name });
        setIoMsg("Backup imported.");
      } catch (err) {
        setIoMsg("Couldn't read that file, is it valid JSON?");
      }
    };
    reader.onerror = () => setIoMsg("Couldn't read that file.");
    reader.readAsText(file);
  };

  const saveTask = (t) => {
    const exists = data.tasks.some((x) => x.id === t.id);
    const tasks = exists ? data.tasks.map((x) => (x.id === t.id ? t : x)) : [...data.tasks, t];
    persist({ ...data, tasks });
    setEditingId(null); setAddingTask(false);
  };
  const deleteTask = (id) => persist({ ...data, tasks: data.tasks.filter((t) => t.id !== id) });
  const addCategory = () => {
    if (!newCat.trim()) return;
    const color = CAT_COLORS[data.categories.length % CAT_COLORS.length].color;
    persist({ ...data, categories: [...data.categories, { id: uid(), name: newCat.trim(), color }] });
    setNewCat(""); setAddingCat(false);
  };
  const deleteCategory = (id) => {
    const cat = data.categories.find((c) => c.id === id);
    const n = data.tasks.filter((t) => t.categoryId === id).length;
    if (!window.confirm(`Remove "${cat?.name}"${n ? ` and its ${n} task${n > 1 ? "s" : ""}` : ""}? History stays in your summary.`)) return;
    persist({ ...data, categories: data.categories.filter((c) => c.id !== id), tasks: data.tasks.filter((t) => t.categoryId !== id) });
  };

  return (
    <div style={{ minHeight: "100vh", background: BASE_BG }}>
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "18px 20px 60px", boxSizing: "border-box" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <IconBtn label="Back to today" onClick={() => nav("today")}><ChevronLeft size={18} /></IconBtn>
          <div className="df-display" style={{ fontSize: 26, fontWeight: 500, flex: 1 }}>Manage</div>
          <GhostBtn onClick={onSwitchProfile} style={{ padding: "9px 14px", fontSize: 14 }}>
            <Users size={15} style={{ verticalAlign: "-2px", marginRight: 7 }} />Switch profile
          </GhostBtn>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {data.categories.map((c) => {
            const tasks = data.tasks.filter((t) => t.categoryId === c.id);
            return (
              <div key={c.id}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 9 }}>
                  <CatDot color={c.color} size={10} />
                  <span style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT, flex: 1 }}>{c.name}</span>
                  <button aria-label={`Remove ${c.name}`} onClick={() => deleteCategory(c.id)}
                    style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 4 }}>
                    <Trash2 size={15} />
                  </button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {tasks.length === 0 && <p style={{ fontSize: 14, color: INK_SOFT, margin: "0 0 2px 2px" }}>No tasks yet.</p>}
                  {tasks.map((t) => editingId === t.id ? (
                    <TaskForm key={t.id} categories={data.categories} allTasks={data.tasks} initial={t} onSave={saveTask} onCancel={() => setEditingId(null)} whySeen={whySeen} onWhySeen={markWhySeen} library={library} mondayStart={weekStartsMonday(data)} />
                  ) : (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderRadius: 12, background: CARD, border: `1px solid ${LINE}` }}>
                      <span style={{ flex: 1 }}>
                        <span style={{ fontWeight: 700, fontSize: 15.5 }}>{t.name}</span>
                        <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>{freqLabel(t.freq)}{t.note ? ` · ${t.note}` : ""}{(() => { const p = pairPartner(data, t, data.tasks); return p ? ` · paired with ${p.name}` : ""; })()}</span>
                      </span>
                      <button aria-label="Edit task" onClick={() => setEditingId(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 5 }}><Pencil size={15} /></button>

                    </div>

                </div>

              + Add a category

          <div style={{ marginTop: 6, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>
            <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT, marginBottom: 12 }}>Preferences</div>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
              <span style={{ flex: 1, fontSize: 15.5, fontWeight: 700 }}>Week starts on</span>
              <div style={{ display: "flex", gap: 5, background: CARD, border: `1px solid ${LINE}`, borderRadius: R_PILL, padding: 4 }}>
                {[["mon", "Monday"], ["sun", "Sunday"]].map(([v, l]) => {

                    <button key={v} onClick={() => setSetting({ weekStart: v })} className="df-btn"

              </div>
            </div>
            <button onClick={toggleVacation} aria-pressed={!!(data.settings && data.settings.vacation)} className="df-btn"
              style={{ width: "100%", minHeight: 44, display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff", cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
              <span style={{ flex: 1 }}>
                <span style={{ fontWeight: 700, fontSize: 15.5 }}>Vacation mode</span>
                <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>Pause streaks, today's screen shows a calm break</span>
              </span>
              {(() => {

                  <span style={{ width: 46, height: 27, borderRadius: 99, flexShrink: 0, background: on ? BRAND : "#C7CED4", position: "relative", transition: "background 200ms ease" }}>

                  </span>
                );
              })()}
            </button>
          </div>

          <div style={{ marginTop: 6, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>
            <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT, marginBottom: 8 }}>Rewards</div>
            <p style={{ fontSize: 14, color: INK_SOFT, margin: "0 0 12px" }}>Earn a point for each task you finish, then redeem points for these.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {(data.rewards || []).map((r) => (
                <div key={r.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <TextInput value={r.name} placeholder="Reward" onChange={(e) => updateReward(r.id, { name: e.target.value })} />
                  <input type="number" min="1" inputMode="numeric" value={r.cost}
                    onChange={(e) => updateReward(r.id, { cost: Math.max(1, Math.round(Number(e.target.value) || 1)) })}
                    style={{ width: 66, padding: "12px 10px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff", fontSize: 16, fontFamily: "inherit", color: INK, boxSizing: "border-box", textAlign: "center" }} />
                  <span style={{ fontSize: 13, color: INK_SOFT, fontWeight: 600, flexShrink: 0 }}>pts</span>
                  <button aria-label="Remove reward" onClick={() => removeReward(r.id)}
                    style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 6, flexShrink: 0 }}>
                    <Trash2 size={16} />
                  </button>
                </div>
              ))}
              <div style={{ display: "flex", gap: 8 }}>
                <TextInput placeholder="New reward (e.g. Movie night)" value={newRewardName} onChange={(e) => setNewRewardName(e.target.value)}

                <input type="number" min="1" inputMode="numeric" placeholder="pts" value={newRewardCost} onChange={(e) => setNewRewardCost(e.target.value)}
                  style={{ width: 66, padding: "12px 10px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff", fontSize: 16, fontFamily: "inherit", color: INK, boxSizing: "border-box", textAlign: "center" }} />
                <PrimaryBtn disabled={!newRewardName.trim() || !(Number(newRewardCost) > 0)} onClick={addReward} style={{ padding: "10px 16px", fontSize: 15 }}>Add</PrimaryBtn>
              </div>
            </div>
          </div>

          <div style={{ marginTop: 6, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>
            <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT, marginBottom: 8 }}>Exercise library</div>
            <p style={{ fontSize: 14, color: INK_SOFT, margin: "0 0 12px" }}>Edit reps and cues, add your own, or reset any built-in exercise to its default.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {[...BODY_PARTS.filter((bp) => library.some((e) => e.bodyPart === bp)), ...[...new Set(library.map((e) => e.bodyPart))].filter((bp) => !BODY_PARTS.includes(bp))].map((bp) => (

                    {library.filter((e) => e.bodyPart === bp).map((ex) => (
                      <div key={ex._added ? ex.id : ex._base} style={{ border: `1px solid ${LINE}`, borderRadius: 12, background: "#FFFFFF", padding: 12, display: "flex", flexDirection: "column", gap: 8 }}>

                          <TextInput value={ex.name} placeholder="Exercise" onChange={(e) => editExercise(ex, "name", e.target.value)} />

                          <button aria-label="Delete exercise" onClick={() => deleteExercise(ex)}

                        </div>
                        <TextInput value={ex.note || ""} placeholder="Form cue" onChange={(e) => editExercise(ex, "note", e.target.value)} />
                        {!ex._added && isExerciseModified(data, ex._base) && (

                      </div>
                    ))}
                  </div>

            {(() => {
              const hidden = EXERCISE_LIBRARY.filter((e) => (data.libraryOverrides?.deleted || []).includes(e.name));

                    {hidden.map((ex) => (
                      <div key={ex.name} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, color: INK_SOFT }}>

            <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${LINE}`, display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: INK_SOFT }}>Add your own</div>
              <div style={{ display: "flex", gap: 8 }}>
                <TextInput placeholder="Exercise name" value={newExName} onChange={(e) => setNewExName(e.target.value)} />
                <input value={newExReps} placeholder="3×12" onChange={(e) => setNewExReps(e.target.value)}
                  style={{ width: 84, padding: "12px 10px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff", fontSize: 15, fontFamily: "inherit", color: INK, boxSizing: "border-box", textAlign: "center" }} />

              <div style={{ display: "flex", gap: 8 }}>
                <select value={newExPart} onChange={(e) => setNewExPart(e.target.value)}

                <TextInput placeholder="Form cue, optional" value={newExNote} onChange={(e) => setNewExNote(e.target.value)} />

              <div><PrimaryBtn disabled={!newExName.trim()} onClick={addExercise} style={{ padding: "10px 16px", fontSize: 15 }}>Add exercise</PrimaryBtn></div>

          </div>

          <div style={{ marginTop: 6, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>
            <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT, marginBottom: 8 }}>Sharing</div>
            <button onClick={() => persist({ ...data, settings: { ...(data.settings || {}), shareActivity: !(data.settings && data.settings.shareActivity) } })} className="df-btn"

              <span style={{ flex: 1 }}>
                <span style={{ fontWeight: 700, fontSize: 15.5 }}>Share my activity</span>
                <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>Post my completed tasks to the shared feed</span>
              </span>
              {(() => {
                const on = !!(data.settings && data.settings.shareActivity);
                return (
                  <span style={{ width: 46, height: 27, borderRadius: 99, flexShrink: 0, background: on ? BRAND : "#C7CED4", position: "relative", transition: "background 200ms ease" }}>
                    <span style={{ position: "absolute", top: 3, left: on ? 22 : 3, width: 21, height: 21, borderRadius: 99, background: "#fff", transition: "left 200ms ease" }} />
                  </span>

            <p style={{ fontSize: 12.5, color: INK_SOFT, margin: "10px 2px 0", lineHeight: 1.5 }}>

          <div style={{ marginTop: 6, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>

              <input ref={fileRef} type="file" accept="application/json,.json" onChange={importProfile} style={{ display: "none" }} />
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}

// Reuses dayStatus() + scheduledTasks() to classify a day for the month grid.
const CAL_COLORS = { all: "#3F7D6A", partial: "#8F6E22", skips: "#A14E3A" };
function dayInfo(data, dateStr) {
  const status = dayStatus(data, dateStr); // true (all done) | false | null (nothing scheduled)
  if (status === null) return "none";
  if (status === true) return "all";
  const sched = scheduledTasks(data, dateStr);
  const entries = entriesFor(data, dateStr);
  if (sched.some((t) => entries.some((e) => e.taskId === t.id && e.status === "done"))) return "partial";
  if (sched.some((t) => entries.some((e) => e.taskId === t.id && e.status === "skipped"))) return "skips";
  return "empty"; // scheduled but nothing recorded
}

function DayDot({ kind }) {
  if (kind === "none") return <span style={{ width: 4, height: 4, borderRadius: 99, background: LINE }} />;
  if (kind === "empty") return <span style={{ width: 9, height: 9, borderRadius: 99, border: `2px solid ${INK_SOFT}`, boxSizing: "border-box" }} />;
  return <span style={{ width: 9, height: 9, borderRadius: 99, background: CAL_COLORS[kind] || LINE }} />;
}

function CalendarView({ data, nav }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selected, setSelected] = useState(null);
  const today = todayKey();
  const now = new Date();
  const view = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = view.getFullYear(), month = view.getMonth();
  const monthName = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const mondayStart = weekStartsMonday(data);
  const firstDow = new Date(year, month, 1).getDay();
  const lead = (firstDow - (mondayStart ? 1 : 0) + 7) % 7; // blank cells before day 1, per week-start
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const legend = [["all", "All done"], ["partial", "Partial"], ["skips", "Skipped"], ["empty", "Nothing logged"]];

  return (
    <div style={{ minHeight: "100vh", background: BASE_BG }}>
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "18px 20px 60px", boxSizing: "border-box" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18 }}>
          <IconBtn label="Back to today" onClick={() => nav("today")}><ChevronLeft size={18} /></IconBtn>
          <div className="df-display" style={{ fontSize: 26, fontWeight: 500, flex: 1 }}>Calendar</div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
          <IconBtn label="Previous month" onClick={() => setMonthOffset((m) => m - 1)}><ChevronLeft size={18} /></IconBtn>
          <span className="df-display" style={{ fontSize: 19, fontWeight: 500 }}>{monthName}</span>
          <span style={{ transform: "scaleX(-1)", display: "inline-flex" }}>
            <IconBtn label="Next month" onClick={() => setMonthOffset((m) => Math.min(0, m + 1))}><ChevronLeft size={18} /></IconBtn>
          </span>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
          {weekdayOrder(mondayStart).map((dow) => (
            <div key={dow} style={{ textAlign: "center", fontSize: 12, fontWeight: 600, color: INK_SOFT }}>{WEEKDAY_LABELS[dow]}</div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {cells.map((d, i) => {
            if (d === null) return <div key={"b" + i} />;
            const k = fmtKey(new Date(year, month, d));
            const isFuture = k > today;
            const isToday = k === today;
            const kind = isFuture ? "none" : dayInfo(data, k);
            return (
              <button key={k} disabled={isFuture} onClick={() => !isFuture && setSelected(k)} className="df-btn"
                style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 5,
                  aspectRatio: "1 / 1", borderRadius: 12, cursor: isFuture ? "default" : "pointer", fontFamily: "inherit",
                  border: isToday ? `1.5px solid ${INK}` : `1px solid ${LINE}`, background: isFuture ? "transparent" : CARD,
                  opacity: isFuture ? 0.4 : 1 }}>
                <span style={{ fontSize: 14, fontWeight: isToday ? 800 : 600, color: INK }}>{d}</span>
                <DayDot kind={kind} />
              </button>
            );
          })}
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: "10px 16px", marginTop: 18 }}>
          <InfoDot label="About the calendar" text="Each square is a day this month. The dot shows how it went: all tasks done, some done, a skip logged, or scheduled but nothing recorded. Empty days had nothing scheduled." />
          {legend.map(([kind, label]) => (
            <span key={kind} style={{ display: "inline-flex", alignItems: "center", gap: 7, fontSize: 12.5, color: INK_SOFT, fontWeight: 600 }}>
              <DayDot kind={kind} />{label}
            </span>
          ))}
        </div>
      </div>

      {selected && (
        <DayDetailSheet data={data} dateStr={selected} onClose={() => setSelected(null)} />
      )}
    </div>
  );
}

// Read-only recap of a single day: what was scheduled and how it went.
function DayDetailSheet({ data, dateStr, onClose }) {
  const sched = scheduledTasks(data, dateStr);
  const entries = entriesFor(data, dateStr);
  const schedIds = new Set(sched.map((t) => t.id));
  const rows = sched.map((t) => ({ task: t, entry: entries.find((e) => e.taskId === t.id) }));
  // Include any recorded entries for tasks not scheduled that day (e.g. later edited).
  entries.forEach((e) => {
    if (!e.taskId) return; // skip non-task entries (e.g. reward redemptions)
    if (!schedIds.has(e.taskId)) {
      const task = data.tasks.find((t) => t.id === e.taskId);
      rows.push({ task: task || { id: e.taskId, name: "(removed task)", categoryId: null }, entry: e });
    }
  });
  const d = new Date(dateStr + "T12:00:00");
  const heading = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  return (
    <Sheet onClose={onClose} label={heading} maxHeight="72vh">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
          <span className="df-display" style={{ fontSize: 21, fontWeight: 500 }}>{heading}</span>
          <IconBtn label="Close" onClick={onClose}><X size={18} /></IconBtn>
        </div>
        {rows.length === 0 ? (
          <p style={{ fontSize: 15, color: INK_SOFT, margin: "4px 2px" }}>Nothing was scheduled this day.</p>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {rows.map(({ task, entry }, i) => {
              const c = task.categoryId && data.categories.find((x) => x.id === task.categoryId);
              const done = entry && entry.status === "done";
              const skipped = entry && entry.status === "skipped";
              const label = done ? (entry.late ? "Done (late)" : "Done") : skipped ? `Skipped${entry.reason ? ` · ${entry.reason}` : ""}` : "Not done";
              const color = done ? CAL_COLORS.all : skipped ? CAL_COLORS.skips : INK_SOFT;
              return (
                <div key={task.id + "-" + i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff" }}>
                  <CatDot color={(c && c.color) || INK_SOFT} />
                  <span style={{ flex: 1 }}>
                    <span style={{ fontWeight: 700, fontSize: 15.5, textDecoration: done ? "none" : skipped ? "none" : "none" }}>{task.name}</span>
                    <span style={{ display: "block", fontSize: 13, color, fontWeight: 600 }}>{label}</span>
                  </span>
                  {done && <Check size={16} color={CAL_COLORS.all} />}
                </div>
              );
            })}
          </div>
        )}
    </Sheet>
  );
}

/* ————— Shared activity feed ————— */
function FeedView({ nav }) {
  const [events, setEvents] = useState(null); // null = loading
  const load = async () => {
    const f = await loadShared(FEED_KEY, []);
    const cutoff = Date.now() - MAX_HISTORY_DAYS * 86400000; // cap to last 60 days
    setEvents(Array.isArray(f) ? f.filter((e) => (e.timestamp || 0) >= cutoff).slice().reverse() : []);
  };
  useEffect(() => { load(); }, []);

  return (
    <div style={{ minHeight: "100vh", background: BASE_BG }}>
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "18px 20px 60px", boxSizing: "border-box" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
          <IconBtn label="Back to today" onClick={() => nav("today")}><ChevronLeft size={18} /></IconBtn>
          <div className="df-display" style={{ fontSize: 26, fontWeight: 500, flex: 1 }}>Activity</div>
          <IconBtn label="Refresh" onClick={load}><ArrowRight size={18} /></IconBtn>
        </div>
        <p style={{ fontSize: 12.5, color: INK_SOFT, margin: "0 0 16px", lineHeight: 1.5 }}>
          Recent completions from everyone sharing activity. Visible to all users of this artifact. Turn sharing on in Manage → Sharing.
        </p>

        {events === null ? (
          <p style={{ fontSize: 15, color: INK_SOFT }}>Loading…</p>
        ) : events.length === 0 ? (
          <p style={{ fontSize: 15, color: INK_SOFT }}>No shared activity yet. When people opt in, their completed tasks show up here.</p>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {events.map((e, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: CARD }}>
                <span style={{ fontSize: 26, lineHeight: 1, flexShrink: 0 }}>{e.token || "🙂"}</span>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ fontWeight: 700, fontSize: 15.5, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.taskName}</span>
                  <span style={{ fontSize: 13, color: INK_SOFT }}>{e.category ? `${e.category} · ` : ""}{timeAgo(e.timestamp)}</span>
                </span>
                <Check size={16} color={CAL_COLORS.all} />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ————— App shell ————— */
function DailyFlow() {
  const [view, setView] = useState("loading");
  const [profiles, setProfiles] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [data, setData] = useState(null);
  const [pendingProfile, setPendingProfile] = useState(null); // {id, name} during setup

  useEffect(() => {
    (async () => {
      const ps = await loadKey("flow:profiles", []);
      setProfiles(ps);
      const act = await loadKey("flow:active", null);
      if (act && ps.some((p) => p.id === act)) {
        const d = await loadKey("flow:p:" + act, null);
        if (d) { setActiveId(act); setData(d); setView("today"); return; }
      }
      setView("profiles");
    })();
  }, []);

  const persist = (next) => { setData(next); saveKeyDebounced("flow:p:" + activeId, next); };

  const openProfile = async (id) => {
    const d = await loadKey("flow:p:" + id, null);
    if (!d) return;
    setActiveId(id); setData(d); saveKey("flow:active", id); setView("today");
  };

  const createProfile = (name, token) => {
    const p = { id: uid(), name, token: token || null };
    setPendingProfile(p);
    setView("setup");
  };

  const finishSetup = async (categories, tasks) => {
    const p = pendingProfile;
    const nextProfiles = [...profiles, p];
    const d = migrate({ version: DATA_VERSION, name: p.name, categories, tasks, history: {}, createdAt: todayKey() });
    setProfiles(nextProfiles);
    await saveKey("flow:profiles", nextProfiles);
    await saveKey("flow:p:" + p.id, d);
    await saveKey("flow:active", p.id);
    setActiveId(p.id); setData(d); setPendingProfile(null); setView("today");
  };

  const switchProfile = () => { setActiveId(null); setData(null); saveKey("flow:active", null); setView("profiles"); };

  const activeProfile = profiles.find((p) => p.id === activeId);
  const activeToken = (activeProfile && activeProfile.token) || null;

  return (
    <div className="df-root" style={{ minHeight: "100vh", background: BASE_BG }}>
      <style>{GLOBAL_CSS}</style>
      {view === "loading" && (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: INK_SOFT, fontSize: 15, fontWeight: 600 }}>
          Opening your flow…
        </div>
      )}
      {view === "profiles" && <ProfilesView profiles={profiles} onOpen={openProfile} onCreate={createProfile} />}
      {view === "setup" && pendingProfile && <SetupView profileName={pendingProfile.name} onFinish={finishSetup} />}
      {view === "today" && data && <TodayView data={data} persist={persist} nav={setView} profileId={activeId} token={activeToken} />}
      {view === "calendar" && data && <CalendarView data={data} nav={setView} />}
      {view === "feed" && data && <FeedView nav={setView} />}
      {view === "summary" && data && <SummaryView data={data} nav={setView} />}
      {view === "manage" && data && <ManageView data={data} persist={persist} nav={setView} onSwitchProfile={switchProfile} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(DailyFlow));
</script>
</body>
