<script>
  /* localStorage-backed shim for the app's async storage API.
     `{ shared: true }` namespaces to a "shared::" prefix. In this static
     build there is no backend, so "shared" keys are only shared within the
     same browser; a hosted deployment would back these with a real store. */
  window.storage = {
    async get(key, opts) { const k = opts && opts.shared ? "shared::" + key : key; const v = localStorage.getItem(k); return v == null ? null : { value: v }; },
    async set(key, val, opts) { const k = opts && opts.shared ? "shared::" + key : key; localStorage.setItem(k, String(val)); },
    async delete(key, opts) { const k = opts && opts.shared ? "shared::" + key : key; localStorage.removeItem(k); },
  };
</script>

  const added = Array.isArray(ov.added) ? ov.added : [];
  const base = EXERCISE_LIBRARY
    .filter((e) => !deleted.has(e.name))
    .map((e) => ({ ...e, ...(edits[e.name] || {}), _base: e.name }));
  return [...base, ...added.map((a) => ({ ...a, _added: true }))];

/* ————— Migration ————— */
// Brings any older profile shape up to the current version, filling defaults
// for missing fields. Must never throw on unexpected/old data.
const DATA_VERSION = 3;
// Map old Eisenhower priority values onto the simplified three-level scheme.
const PRIORITY_LEGACY = { "urgent-important": "must", important: "important", urgent: "wait", neither: "wait" };
function migratePriority(p) {
  if (p == null) return null;
  if (PRIORITY_LEGACY[p]) return PRIORITY_LEGACY[p];
  return ["must", "important", "wait"].includes(p) ? p : null;
}
function migrate(data) {
  if (!data || typeof data !== "object") return data;
  try {
    const d = { ...data };
    d.version = DATA_VERSION;
    if (!d.settings || typeof d.settings !== "object") d.settings = {};
    if (!Array.isArray(d.rewards)) d.rewards = [];
    if (!Array.isArray(d.categories)) d.categories = [];
    if (!d.history || typeof d.history !== "object") d.history = {};
    if (!d.libraryOverrides || typeof d.libraryOverrides !== "object") d.libraryOverrides = {};
    if (!d.timers || typeof d.timers !== "object") d.timers = {}; // { dateKey: { taskId: elapsedSeconds } }
    if (!d.createdAt) d.createdAt = todayKey();
    d.tasks = (Array.isArray(d.tasks) ? d.tasks : []).map((raw) => {
      const t = raw && typeof raw === "object" ? raw : {};
      return {
        ...t,
        subtasks: Array.isArray(t.subtasks) ? t.subtasks : [],
        eta: t.eta ?? null,
        pairId: t.pairId ?? null,
        pleasantNote: t.pleasantNote ?? null,
        priority: migratePriority(t.priority ?? null),
        deadline: t.deadline ?? null,
        rotationLabel: t.rotationLabel ?? null,
      };
    });
    return d;
  } catch (e) {
    console.error("migrate failed", e);
    return data;
  }
}

async function loadKey(key, fallback) {
  try {
    const r = await window.storage.get(key);
    const val = r && r.value != null ? JSON.parse(r.value) : fallback;
    // Migrate whenever a profile's data blob loads.
    if (val && typeof key === "string" && key.startsWith("flow:p:")) return migrate(val);
    return val;
  } catch { return fallback; }
}
async function saveKey(key, val) {
  try { await window.storage.set(key, JSON.stringify(val)); }
  catch (e) { console.error("save failed", e); }
}
// Trailing-debounced writes (400ms) so rapid edits don't hammer storage.
const _writeTimers = {};
function saveKeyDebounced(key, val) {
  clearTimeout(_writeTimers[key]);
  _writeTimers[key] = setTimeout(() => { delete _writeTimers[key]; saveKey(key, val); }, 400);
}
const MAX_HISTORY_DAYS = 60; // cap day-by-day history reads in Feed/Summary

// Shared store — visible to every user of this artifact (opt-in feed only).
async function loadShared(key, fallback) {
  try {
    const r = await window.storage.get(key, { shared: true });
    return r && r.value != null ? JSON.parse(r.value) : fallback;
  } catch { return fallback; }
}
async function saveShared(key, val) {
  try { await window.storage.set(key, JSON.stringify(val), { shared: true }); }
  catch (e) { console.error("shared save failed", e); }
}

/* ————— Dates ————— */
const fmtKey = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayKey = () => fmtKey(new Date());
// Whole days from today until a YYYY-MM-DD date (negative once it's past).
const daysUntil = (dateStr) =>
  Math.round((new Date(dateStr + "T12:00:00") - new Date(todayKey() + "T12:00:00")) / 86400000);
// Seconds -> "m:ss".
const fmtClock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;
// Timestamp -> "just now" / "5m ago" / "3h ago" / "2d ago".
const timeAgo = (ts) => {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
};
const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
const niceDate = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

/* ————— Settings + scheduling ————— */
const settingsOf = (data) => (data && data.settings) || {};
const weekStartsMonday = (data) => settingsOf(data).weekStart !== "sun"; // Monday is the default
const isVacationDay = (data, dateStr) => (settingsOf(data).vacationDays || []).includes(dateStr);
// Seconds already banked on a task's timer for a given day (0 if none).
const savedElapsed = (data, dateStr, taskId) => (((data && data.timers) || {})[dateStr] || {})[taskId] || 0;

// The seven date keys of the week containing dateStr, honoring the week-start setting.
function weekDates(dateStr, mondayStart = true) {
  const d = new Date(dateStr + "T12:00:00");
  const startDow = mondayStart ? 1 : 0; // 1=Mon, 0=Sun
  const offset = (d.getDay() - startDow + 7) % 7;
  const first = addDays(d, -offset);
  const out = [];
  for (let i = 0; i < 7; i++) out.push(fmtKey(addDays(first, i)));
  return out;
}
// How many times a task has been completed in the week of dateStr.
function weeklyDoneCount(data, task, dateStr) {
  let n = 0;
  for (const k of weekDates(dateStr, weekStartsMonday(data))) {
    for (const e of entriesFor(data, k)) {
      if (e.taskId === task.id && e.status === "done") n++;
    }
  }
  return n;
}
// The task paired with `task` (link is one-directional but recognized from
// either side), but only if that partner is present in `pool` (e.g. still due
// and unlogged today). Returns null otherwise.
function pairPartner(data, task, pool) {
  if (!task) return null;
  let p = task.pairId ? data.tasks.find((t) => t.id === task.pairId) : null;
  if (!p) p = data.tasks.find((t) => t.pairId === task.id) || null;
  if (!p || p.id === task.id) return null;
  return pool.some((t) => t.id === p.id) ? p : null;
}

// Whether a one-time task has ever been completed.
function onceDone(data, taskId) {
  const h = (data && data.history) || {};
  for (const k in h) {
    for (const e of h[k]) if (e.taskId === taskId && e.status === "done") return true;
  }
  return false;
}

/* ————— Reward points ————— */
// A done task earns 1 point, or 2 if flagged "Must do today".
function taskPoints(task) { return task && task.priority === "must" ? 2 : 1; }
function pointsEarned(data) {
  let pts = 0;
  const h = (data && data.history) || {};
  for (const k in h) for (const e of h[k]) {
    if (e && e.status === "done") pts += taskPoints(data.tasks.find((t) => t.id === e.taskId));
  }
  return pts;
}
function pointsRedeemed(data) {
  let c = 0;
  const h = (data && data.history) || {};
  for (const k in h) for (const e of h[k]) if (e && e.kind === "redeem") c += e.cost || 0;
  return c;
}
function pointsBalance(data) { return pointsEarned(data) - pointsRedeemed(data); }

function scheduledTasks(data, dateStr) {
  if (!data) return [];
  const d = new Date(dateStr + "T12:00:00");
  const wd = d.getDay();
  const dayNum = Math.floor(d.getTime() / 86400000);
  const rotGroups = {};
  data.tasks.forEach((t) => {
    if (t.freq.type === "rotate") {
      (rotGroups[t.categoryId] = rotGroups[t.categoryId] || []).push(t);
    }
  });
  // Rotation order: by label (so a body-part split cycles predictably), then id.
  Object.values(rotGroups).forEach((g) => g.sort((a, b) => {
    const la = (a.rotationLabel || "").toLowerCase(), lb = (b.rotationLabel || "").toLowerCase();
    if (la !== lb) return la < lb ? -1 : 1;
    return a.id < b.id ? -1 : 1;
  }));
  const catOrder = data.categories.map((c) => c.id);
  const out = data.tasks.filter((t) => {
    if (t.freq.type === "daily") return true;
    if (t.freq.type === "days") return (t.freq.days || []).includes(wd);
    if (t.freq.type === "weekly") {
      const need = Math.max(1, t.freq.count || 1);
      return weeklyDoneCount(data, t, dateStr) < need;
    }
    if (t.freq.type === "once") {
      if (onceDone(data, t.id)) return false;          // finished — stop appearing
      if (t.freq.deadline && dateStr > t.freq.deadline) return false; // deadline passed
      return true;                                     // otherwise every day
    }
    if (t.freq.type === "rotate") {
      const g = rotGroups[t.categoryId];
      if (!g || !g.length) return false;
      return g[dayNum % g.length].id === t.id;
    }
    return false;
  });
  out.sort((a, b) => {
    const pa = PRIORITY_RANK[a.priority] ?? PRIORITY_RANK._unset;
    const pb = PRIORITY_RANK[b.priority] ?? PRIORITY_RANK._unset;
    if (pa !== pb) return pa - pb; // priority first
    const ca = catOrder.indexOf(a.categoryId), cb = catOrder.indexOf(b.categoryId);
    if (ca !== cb) return ca - cb; // then category
    return data.tasks.indexOf(a) - data.tasks.indexOf(b);
  });
  return out;
}

function entriesFor(data, dateStr) { return (data.history && data.history[dateStr]) || []; }

function dayStatus(data, dateStr, categoryId) {
  if (isVacationDay(data, dateStr)) return null; // break days never count for/against streaks
  let sched = scheduledTasks(data, dateStr);
  if (categoryId) sched = sched.filter((t) => t.categoryId === categoryId);
  if (!sched.length) return null; // nothing scheduled that day
  const entries = entriesFor(data, dateStr);
  return sched.every((t) => entries.some((e) => e.taskId === t.id && e.status === "done"));
}

function currentStreak(data, categoryId) {
  if (!data) return 0;
  const start = data.createdAt || todayKey();
  let streak = 0;
  const today = todayKey();
  if (dayStatus(data, today, categoryId) === true) streak++;
  let cursor = addDays(new Date(), -1);
  for (let i = 0; i < 730; i++) {
    const k = fmtKey(cursor);
    if (k < start) break;
    const s = dayStatus(data, k, categoryId);
    if (s === false) break;
    if (s === true) streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}

function bestStreak(data, categoryId) {
  if (!data) return 0;
  const start = new Date((data.createdAt || todayKey()) + "T12:00:00");
  let best = 0, run = 0;
  let cursor = start;
  const end = todayKey();
  for (let i = 0; i < 730; i++) {
    const k = fmtKey(cursor);
    if (k > end) break;
    const s = dayStatus(data, k, categoryId);
    if (s === true) { run++; best = Math.max(best, run); }
    else if (s === false) run = 0;
    cursor = addDays(cursor, 1);
  }
  return Math.max(best, run);
}

// Accessible bottom sheet: focus trap, Escape to close, restores focus, and
// role="dialog" / aria-modal. Wraps the shared overlay + card chrome.
function Sheet({ onClose, children, maxHeight = "80vh", label }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const prev = document.activeElement;
    const sel = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
    const list = () => Array.from(el.querySelectorAll(sel)).filter((n) => !n.disabled && n.offsetParent !== null);
    const firstEl = list()[0];
    if (firstEl) firstEl.focus();
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); onClose(); return; }
      if (e.key === "Tab") {
        const f = list();
        if (!f.length) return;
        const a = f[0], b = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); b.focus(); }
        else if (!e.shiftKey && document.activeElement === b) { e.preventDefault(); a.focus(); }
      }
    };
    el.addEventListener("keydown", onKey);
    return () => { el.removeEventListener("keydown", onKey); if (prev && prev.focus) prev.focus(); };
  }, []);
  return (
    <div className="df-veil" onClick={onClose} role="dialog" aria-modal="true" aria-label={label || "Sheet"}
      style={{ position: "fixed", inset: 0, background: "rgba(17,24,32,0.4)", zIndex: 60, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div ref={ref} onClick={(e) => e.stopPropagation()} className="df-card-in"
        style={{ background: CARD, borderRadius: "12px 12px 0 0", width: "100%", maxWidth: 520, maxHeight, overflowY: "auto", padding: "20px 20px 30px", boxSizing: "border-box", boxShadow: SHADOW }}>
        {children}
      </div>
    </div>
  );
}

            style={{ display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderRadius: 99, fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", border: `1px solid ${categoryId === c.id ? BRAND : LINE}`, background: categoryId === c.id ? BRAND_SOFT : "transparent", color: categoryId === c.id ? BRAND : INK_SOFT }}>
            <CatDot color={c.color} size={7} /> {c.name}
          </button>
        ))}
      </div>
      {isBody && (
        <GhostBtn onClick={() => setShowLib(true)} style={{ padding: "11px 16px", fontSize: 15 }}>
          Choose from exercise library
        </GhostBtn>
      )}
      {showLib && (
        <ExerciseSheet library={library} onPick={pickExercise} onClose={() => setShowLib(false)} />
      )}
      <FreqEditor freq={freq} onChange={setFreq} mondayStart={mondayStart} />
      {freq.type === "rotate" && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: INK_SOFT, letterSpacing: "0.04em", textTransform: "uppercase" }}>Rotation</span>
            <Why id="rotation" seen={whySeen} onSeen={onWhySeen} />
          </div>
          <TextInput placeholder="Rotation label, optional (e.g. Push, Pull, Legs)" value={rotationLabel} onChange={(e) => setRotationLabel(e.target.value)} />
        </div>
      )}
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: INK_SOFT, letterSpacing: "0.04em", textTransform: "uppercase", marginBottom: 8 }}>Priority, optional</div>
        <div style={{ display: "flex", gap: 6 }}>
          {PRIORITY_LEVELS.map((q) => {
            const on = priority === q.key;
            return (
              <button key={q.key} onClick={() => setPriority(on ? "" : q.key)} className="df-btn"
                style={{ flex: 1, padding: "10px 8px", borderRadius: R_PILL, fontFamily: "inherit", cursor: "pointer", textAlign: "center",
                  border: `1px solid ${on ? BRAND : LINE}`, background: on ? BRAND_SOFT : "transparent" }}>
                <span style={{ display: "block", fontSize: 13, fontWeight: 700, color: on ? BRAND : INK }}>{q.label}</span>
                <span style={{ display: "block", fontSize: 11, color: INK_SOFT, marginTop: 1 }}>{q.hint}</span>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <TextInput type="number" min="1" inputMode="numeric" placeholder="Estimated minutes, optional" value={eta} onChange={(e) => setEta(e.target.value)} />
        <span style={{ fontSize: 14, color: INK_SOFT, fontWeight: 600, flexShrink: 0 }}>min</span>
      </div>
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: INK_SOFT, letterSpacing: "0.04em", textTransform: "uppercase", marginBottom: 8 }}>Subtasks, optional</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {subtasks.map((s) => (
            <div key={s.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <TextInput value={s.name} placeholder="Subtask" onChange={(e) => renameSub(s.id, e.target.value)} />
              <button aria-label="Remove subtask" onClick={() => removeSub(s.id)}
                style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 6, flexShrink: 0 }}>
                <Trash2 size={16} />
              </button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <TextInput placeholder="Add a step…" value={newSub} onChange={(e) => setNewSub(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addSub(); } }} />
            <PrimaryBtn disabled={!newSub.trim()} onClick={addSub} style={{ padding: "10px 16px", fontSize: 15 }}>Add</PrimaryBtn>
          </div>
        </div>
      </div>
      {pairChoices.length > 0 && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: INK_SOFT, letterSpacing: "0.04em", textTransform: "uppercase" }}>Habit stacking, optional</span>
            <Why id="pairing" seen={whySeen} onSeen={onWhySeen} />
          </div>
          <select value={pairId} onChange={(e) => setPairId(e.target.value)}
            style={{ width: "100%", padding: "12px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff", fontSize: 16, fontFamily: "inherit", color: INK, boxSizing: "border-box" }}>
            <option value="">Not paired</option>
            {pairChoices.map((t) => <option key={t.id} value={t.id}>Pair with {t.name}</option>)}
          </select>
          {pairId && (
            <div style={{ marginTop: 8 }}>
              <TextInput placeholder="A pleasant touch, e.g. with your favorite playlist" value={pleasantNote} onChange={(e) => setPleasantNote(e.target.value)} />
            </div>
          )}
          <p style={{ fontSize: 13, color: INK_SOFT, margin: "8px 2px 0" }}>
            Paired tasks show up together on one card and complete as a pair.
          </p>
        </div>
      )}
      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        {onCancel && <GhostBtn onClick={onCancel} style={{ padding: "10px 16px", fontSize: 15 }}>Cancel</GhostBtn>}
        <PrimaryBtn disabled={!name.trim()} style={{ padding: "10px 18px", fontSize: 15 }}
          onClick={() => onSave({ id: initial?.id || uid(), name: name.trim(), note: note.trim(), categoryId, freq, rotationLabel: freq.type === "rotate" ? (rotationLabel.trim() || null) : null, priority: priority || null, eta: Number(eta) > 0 ? Math.round(Number(eta)) : null, pairId: pairId || null, pleasantNote: pairId && pleasantNote.trim() ? pleasantNote.trim() : null, subtasks: subtasks.filter((s) => s.name.trim()).map((s) => ({ id: s.id, name: s.name.trim() })) })}>
          {initial ? "Save changes" : "Add task"}
        </PrimaryBtn>
      </div>
    </div>
  );
}

/* ————— Profiles screen ————— */
// A token drawn as a solid color circle with a single letter — no emoji.
function TokenCircle({ color, label, size = 40 }) {
  return (
    <span aria-hidden="true" className="df-display"
      style={{ width: size, height: size, borderRadius: 99, background: color, color: "#FFFFFF",
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        fontWeight: 700, fontSize: Math.round(size * 0.42), lineHeight: 1, flexShrink: 0 }}>
      {label}
    </span>
  );
}

function ProfilesView({ profiles, onOpen, onCreate }) {
  const [name, setName] = useState("");
  const [selectedToken, setSelectedToken] = useState(null); // token id, or null
  const owners = {}; // token id -> profile
  profiles.forEach((p) => { if (p.token) owners[p.token] = p; });
  const knownIds = new Set(TOKENS.map((t) => t.id));
  const legacy = profiles.filter((p) => !p.token || !knownIds.has(p.token)); // pre-token or old-emoji profiles
  const selectedTok = TOKENS.find((t) => t.id === selectedToken) || null;
  const pick = (tokId) => { setSelectedToken(tokId); setName(""); };
  const claim = () => { if (selectedToken && name.trim()) { onCreate(name.trim(), selectedToken); setName(""); setSelectedToken(null); } };

  return (
    <div style={{ maxWidth: 460, margin: "0 auto", padding: "56px 20px", display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ textAlign: "center" }}>
        <div className="df-display" style={{ fontSize: 44, fontWeight: 600 }}>Daily Flow</div>
        <p style={{ color: INK_SOFT, fontSize: 16, marginTop: 8 }}>Pick your token to begin, or tap yours to continue.</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
        {TOKENS.map((tok) => {
          const owner = owners[tok.id];
          const selected = selectedToken === tok.id;
          return (
            <button key={tok.id} className="df-btn"
              onClick={() => (owner ? onOpen(owner.id) : pick(tok.id))}
              aria-label={owner ? `Open ${owner.name}` : `Claim token ${tok.label}`}
              style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, aspectRatio: "1 / 1",
                borderRadius: 12, cursor: "pointer", fontFamily: "inherit",
                border: `1.5px solid ${selected ? INK : LINE}`,
                background: selected ? INK + "0D" : owner ? CARD : "#fff",
                opacity: owner || selected || !selectedToken ? 1 : 0.55 }}>
              <TokenCircle color={tok.color} label={tok.label} size={40} />
              {owner
                ? <span style={{ fontSize: 11, fontWeight: 700, color: INK_SOFT, maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", padding: "0 4px" }}>{owner.name}</span>
                : <span style={{ fontSize: 10.5, fontWeight: 600, color: selected ? INK : "#9BA3AB" }}>{selected ? "Selected" : "Available"}</span>}
            </button>
          );
        })}
      </div>

      {selectedToken && (
        <div className="df-card-in" style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: R_CARD, padding: 16, display: "flex", gap: 10, alignItems: "center", boxShadow: SHADOW }}>
          {selectedTok && <TokenCircle color={selectedTok.color} label={selectedTok.label} size={38} />}
          <TextInput placeholder="Your name" value={name} autoFocus
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") claim(); }} />
          <PrimaryBtn disabled={!name.trim()} onClick={claim} style={{ padding: "10px 18px", fontSize: 15, whiteSpace: "nowrap" }}>Claim</PrimaryBtn>
        </div>
      )}

      {legacy.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {legacy.map((p) => (
            <button key={p.id} onClick={() => onOpen(p.id)} className="df-btn"
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 12, border: `1px solid ${LINE}`, background: CARD, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
              <span style={{ width: 34, height: 34, borderRadius: 99, background: INK, color: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 15 }}>{p.name.slice(0, 1).toUpperCase()}</span>
              <span style={{ fontSize: 16, fontWeight: 600, color: INK, flex: 1 }}>{p.name}</span>
              <ArrowRight size={18} color={INK_SOFT} />
            </button>
          ))}
        </div>
      )}

      <p style={{ fontSize: 13, color: INK_SOFT, textAlign: "center" }}>
        Each token belongs to one profile, with its own tasks and history.
      </p>
    </div>
  );
}

/* ————— Setup flow (guided 3-step wizard) ————— */
const SETUP_STEPS = ["Your areas", "Your daily routine", "This week"];
function SetupView({ profileName, onFinish }) {
  const [step, setStep] = useState(0);
  const [cats, setCats] = useState(DEFAULT_CATEGORIES.map((c) => ({ ...c, on: true })));
  const [customName, setCustomName] = useState("");
  const [tasks, setTasks] = useState([]);
  const [formOpen, setFormOpen] = useState(false); // "add a task" form (step 2)
  const [editId, setEditId] = useState(null);       // task being edited (step 2)
  const [whySeen, setWhySeen] = useState([]);
  const markWhySeen = (id) => setWhySeen((s) => [...s, id]);
  // Step 3 "this week" goal composer
  const [goalName, setGoalName] = useState("");
  const [goalMode, setGoalMode] = useState("once"); // "once" | "weekly"
  const [goalDate, setGoalDate] = useState("");
  const [goalCount, setGoalCount] = useState(1);
  const [goalCatId, setGoalCatId] = useState(null);

  const chosenCats = cats.filter((c) => c.on).map(({ on, hint, ...c }) => c);
  const catName = (id) => (chosenCats.find((c) => c.id === id) || {}).name;

  const addCustom = () => {
    if (!customName.trim()) return;
    const color = CAT_COLORS[cats.length % CAT_COLORS.length].color;
    setCats([...cats, { id: uid(), name: customName.trim(), color, hint: "your own category", on: true }]);
    setCustomName("");
  };

  const addWorkoutSplit = () => {
    let body = cats.find((c) => c.name === "Body");
    if (!body) {
      body = { id: uid(), name: "Body", color: CAT_COLORS[cats.length % CAT_COLORS.length].color, hint: "workout · food · sleep · water", on: true };
      setCats([...cats, body]);
    } else if (!body.on) {
      setCats(cats.map((c) => (c.id === body.id ? { ...c, on: true } : c)));
    }
    setTasks([...tasks, ...makeWorkoutSplit(EXERCISE_LIBRARY, body.id)]);
  };

  const addHouseholdBasics = () => {
    let hh = cats.find((c) => c.name === "Household");
    let hhId;
    if (!hh) {
      hhId = cats.some((c) => c.id === "household") ? uid() : "household";
      setCats([...cats, { id: hhId, ...HOUSEHOLD_CATEGORY, on: true }]);
    } else {
      hhId = hh.id;
      if (!hh.on) setCats(cats.map((c) => (c.id === hhId ? { ...c, on: true } : c)));
    }
    setTasks([...tasks, ...makeHouseholdTasks(hhId)]);
  };

  const templateOn = (key) => tasks.some((t) => t._tpl === key);
  const toggleTemplate = (tpl) => {
    if (templateOn(tpl.key)) { setTasks(tasks.filter((t) => t._tpl !== tpl.key)); return; }
    const cat = chosenCats.find((c) => c.name === tpl.cat) || chosenCats[0];
    if (!cat) return;
    setTasks([...tasks, makeRoutineTask(tpl, cat.id)]);
  };

  const saveNewTask = (t) => { setTasks([...tasks, t]); setFormOpen(false); };
  const saveEditTask = (t) => {
    setTasks(tasks.map((x) => (x.id === t.id ? { ...t, _tpl: x._tpl, _goal: x._goal } : x)));
    setEditId(null);
  };
  const removeTask = (id) => setTasks(tasks.filter((t) => t.id !== id));

  const goals = tasks.filter((t) => t._goal);
  const addGoal = () => {
    const nm = goalName.trim();
    const catId = goalCatId || chosenCats[0]?.id;
    if (!nm || !catId) return;
    const freq = goalMode === "weekly"
      ? { type: "weekly", count: Math.max(1, goalCount) }
      : { type: "once", deadline: goalDate || null };
    setTasks([...tasks, { id: uid(), name: nm, note: "", categoryId: catId, freq, rotationLabel: null, priority: null, eta: null, pairId: null, pleasantNote: null, subtasks: [], _goal: true }]);
    setGoalName(""); setGoalDate(""); setGoalCount(1);
  };

  const finish = () => onFinish(chosenCats, tasks.map(({ _tpl, _goal, ...t }) => t));

  // A simple task row (name + category · frequency) with edit + remove.
  const taskRow = (t) => (
    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, background: CARD, border: `1px solid ${LINE}` }}>
      <CatDot color={(chosenCats.find((c) => c.id === t.categoryId) || {}).color || INK} />
      <span style={{ flex: 1 }}>
        <span style={{ fontWeight: 700, fontSize: 15.5 }}>{t.name}</span>
        <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>{catName(t.categoryId)} · {freqLabel(t.freq)}</span>
      </span>
      <button aria-label="Edit task" onClick={() => { setFormOpen(false); setEditId(t.id); }} style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 6 }}><Pencil size={15} /></button>
      <button aria-label="Remove task" onClick={() => removeTask(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 6 }}><Trash2 size={16} /></button>
    </div>
  );

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "40px 20px 80px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        {step > 0 && <IconBtn label="Back" onClick={() => setStep(step - 1)}><ChevronLeft size={18} /></IconBtn>}
        <div>
          <div style={{ fontSize: 13, letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: 600, color: INK_SOFT }}>Step {step + 1} of 3 · {profileName}</div>
          <div className="df-display" style={{ fontSize: 28, fontWeight: 500, marginTop: 2 }}>{SETUP_STEPS[step]}</div>
        </div>
      </div>

      {/* progress dots */}
      <div style={{ display: "flex", gap: 6, marginBottom: 22 }}>
        {SETUP_STEPS.map((_, i) => (
          <div key={i} style={{ flex: 1, height: 4, borderRadius: 99, background: i <= step ? BRAND : LINE, transition: "background 200ms ease" }} />
        ))}
      </div>

      {step === 0 && (
        <div className="df-card-in" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <p style={{ fontSize: 14.5, color: INK_SOFT, margin: "0 0 2px" }}>Pick the areas of life you want to nurture. You can change these later.</p>
          {cats.map((c, i) => (
            <button key={c.id} onClick={() => setCats(cats.map((x, j) => (j === i ? { ...x, on: !x.on } : x)))} className="df-btn"
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", borderRadius: 12, cursor: "pointer", fontFamily: "inherit", textAlign: "left", border: `1.5px solid ${c.on ? BRAND : LINE}`, background: c.on ? BRAND_SOFT : "#FFFFFF" }}>
              <CatDot color={c.color} size={12} />
              <span style={{ flex: 1 }}>
                <span style={{ fontSize: 17, fontWeight: 700, color: INK }}>{c.name}</span>
                <span style={{ display: "block", fontSize: 13.5, color: INK_SOFT }}>{c.hint}</span>
              </span>
              {c.on && <Check size={18} color={BRAND} />}
            </button>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <TextInput placeholder="Add your own area" value={customName} onChange={(e) => setCustomName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addCustom()} />
            <GhostBtn onClick={addCustom} style={{ padding: "10px 14px" }}><Plus size={18} /></GhostBtn>
          </div>
          <PrimaryBtn disabled={!chosenCats.length} onClick={() => setStep(1)} style={{ marginTop: 12 }}>Continue</PrimaryBtn>
        </div>
      )}

      {step === 1 && (
        <div className="df-card-in" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <p style={{ fontSize: 14.5, color: INK_SOFT, margin: 0 }}>Tap a suggestion to add it, then edit anything to fit your day.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {ROUTINE_TEMPLATES.map((tpl) => {
              const on = templateOn(tpl.key);
              const dest = (chosenCats.find((c) => c.name === tpl.cat) || chosenCats[0] || {}).name;
              return (
                <button key={tpl.key} onClick={() => toggleTemplate(tpl)} disabled={!chosenCats.length} className="df-btn"
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 15px", borderRadius: 12, cursor: "pointer", fontFamily: "inherit", textAlign: "left", border: `1.5px solid ${on ? BRAND : LINE}`, background: on ? BRAND_SOFT : "#FFFFFF" }}>
                  <span style={{ width: 24, height: 24, borderRadius: 7, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", border: `2px solid ${on ? BRAND : "#C7CED4"}`, background: on ? BRAND : "transparent" }}>
                    {on ? <Check size={15} color="#FFFFFF" strokeWidth={3} /> : <Plus size={14} color="#9BA3AB" />}
                  </span>
                  <span style={{ flex: 1 }}>
                    <span style={{ fontSize: 15.5, fontWeight: 700, color: INK }}>{tpl.name}</span>
                    <span style={{ display: "block", fontSize: 12.5, color: INK_SOFT }}>Every day{dest ? ` · ${dest}` : ""}</span>
                  </span>
                </button>
              );
            })}
          </div>

          {tasks.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: INK_SOFT }}>Your tasks · {tasks.length}</div>
              {tasks.map((t) => (editId === t.id ? (
                <TaskForm key={t.id} categories={chosenCats} allTasks={tasks} initial={t} whySeen={whySeen} onWhySeen={markWhySeen} library={EXERCISE_LIBRARY}
                  onSave={saveEditTask} onCancel={() => setEditId(null)} />
              ) : taskRow(t)))}
            </div>
          )}

          {formOpen ? (
            <TaskForm key={"new" + tasks.length} categories={chosenCats} allTasks={tasks} whySeen={whySeen} onWhySeen={markWhySeen} library={EXERCISE_LIBRARY}
              onSave={saveNewTask} onCancel={() => setFormOpen(false)} />
          ) : (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <GhostBtn onClick={() => { setEditId(null); setFormOpen(true); }}><Plus size={16} style={{ verticalAlign: "-3px", marginRight: 6 }} />Add your own</GhostBtn>
              <GhostBtn onClick={addWorkoutSplit}>Add home workout split</GhostBtn>
              <GhostBtn onClick={addHouseholdBasics}>Add household basics</GhostBtn>
            </div>
          )}

          <PrimaryBtn onClick={() => setStep(2)} style={{ marginTop: 6 }}>Continue</PrimaryBtn>
        </div>
      )}

      {step === 2 && (
        <div className="df-card-in" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <p style={{ fontSize: 14.5, color: INK_SOFT, margin: 0 }}>Optional. Add a few goals for this week: a one-time to-do with a date, or something to hit a set number of times.</p>

          {goals.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {goals.map((t) => (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, background: CARD, border: `1px solid ${LINE}` }}>
                  <CatDot color={(chosenCats.find((c) => c.id === t.categoryId) || {}).color || INK} />
                  <span style={{ flex: 1 }}>
                    <span style={{ fontWeight: 700, fontSize: 15.5 }}>{t.name}</span>
                    <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>{catName(t.categoryId)} · {freqLabel(t.freq)}</span>
                  </span>
                  <button aria-label="Remove goal" onClick={() => removeTask(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: INK_SOFT, padding: 6 }}><Trash2 size={16} /></button>
                </div>
              ))}
            </div>
          )}

          <div style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: R_CARD, padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
            <TextInput placeholder="Goal (e.g. call the dentist)" value={goalName} onChange={(e) => setGoalName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addGoal(); } }} />
            <div style={{ display: "flex", gap: 6 }}>
              {[["once", "One-time"], ["weekly", "Weekly"]].map(([v, l]) => (
                <button key={v} onClick={() => setGoalMode(v)} className="df-btn"
                  style={{ flex: 1, padding: "9px 4px", borderRadius: R_PILL, fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", border: `1px solid ${goalMode === v ? INK : LINE}`, background: goalMode === v ? INK : "transparent", color: goalMode === v ? "#FFFFFF" : INK }}>
                  {l}
                </button>
              ))}
            </div>
            {goalMode === "once" ? (
              <div>
                <TextInput type="date" value={goalDate} min={todayKey()} onChange={(e) => setGoalDate(e.target.value)} />
                <p style={{ fontSize: 12.5, color: INK_SOFT, margin: "6px 2px 0" }}>Date optional, shows every day until you finish it or the date passes.</p>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 6 }}>
                {[1, 2, 3, 4, 5, 6, 7].map((n) => (
                  <button key={n} onClick={() => setGoalCount(n)} className="df-btn"
                    style={{ flex: 1, padding: "8px 0", borderRadius: R_PILL, fontSize: 14, fontWeight: 700, fontFamily: "inherit", cursor: "pointer", border: `1px solid ${goalCount === n ? INK : LINE}`, background: goalCount === n ? INK : "transparent", color: goalCount === n ? "#FFFFFF" : INK_SOFT }}>
                    {n}
                  </button>
                ))}
              </div>
            )}
            {chosenCats.length > 1 && (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {chosenCats.map((c) => {
                  const on = (goalCatId || chosenCats[0]?.id) === c.id;
                  return (
                    <button key={c.id} onClick={() => setGoalCatId(c.id)} className="df-btn"
                      style={{ display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderRadius: 99, fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", border: `1px solid ${on ? BRAND : LINE}`, background: on ? BRAND_SOFT : "transparent", color: on ? BRAND : INK_SOFT }}>
                      <CatDot color={c.color} size={7} /> {c.name}
                    </button>
                  );
                })}
              </div>
            )}
            <PrimaryBtn disabled={!goalName.trim()} onClick={addGoal} style={{ padding: "11px 18px", fontSize: 15 }}>Add goal</PrimaryBtn>
          </div>

          <PrimaryBtn disabled={!tasks.length} onClick={finish} style={{ marginTop: 6 }}>
            Start my flow{tasks.length ? ` · ${tasks.length} task${tasks.length > 1 ? "s" : ""}` : ""}
          </PrimaryBtn>
          <p style={{ fontSize: 13, color: INK_SOFT, textAlign: "center", margin: 0 }}>You can add, edit, or remove anything later in Manage.</p>
        </div>
      )}
    </div>
  );
}

/* ————— Today (the heart) ————— */
function TodayView({ data, persist, nav, profileId, token }) {
  const tk = todayKey();
  const scheduled = useMemo(() => scheduledTasks(data, tk), [data, tk]);
  const entries = entriesFor(data, tk);
  const remaining = scheduled.filter((t) => !entries.some((e) => e.taskId === t.id));
  const [jumpId, setJumpId] = useState(null);
  const [skipping, setSkipping] = useState(false);
  const [skipText, setSkipText] = useState("");
  const [celebrate, setCelebrate] = useState(false);
  const [showOverview, setShowOverview] = useState(false);
  const [showRewards, setShowRewards] = useState(false);
  const [showQuick, setShowQuick] = useState(false);
  const [showMore, setShowMore] = useState(false); // "More" nav menu
  const [quickName, setQuickName] = useState("");
  const [breakPeek, setBreakPeek] = useState(false); // "do something anyway" while on break
  const [undo, setUndo] = useState(null); // { label } for the most recent entry
  const [subChecks, setSubChecks] = useState({}); // subtaskId -> true, for the current task
  const [timerStart, setTimerStart] = useState(null); // ms the running segment began, or null when paused/stopped
  const [accumSec, setAccumSec] = useState(0);        // seconds banked from earlier segments of the current task today
  const [nowMs, setNowMs] = useState(Date.now());
  const timer = useRef(null);
  const undoTimer = useRef(null);
  useEffect(() => () => { clearTimeout(timer.current); clearTimeout(undoTimer.current); }, []);
  useEffect(() => {
    if (timerStart == null) return;
    const iv = setInterval(() => setNowMs(Date.now()), 500);
    return () => clearInterval(iv);
  }, [timerStart]);
  useEffect(() => {
    if (!showMore) return;
    const onKey = (e) => { if (e.key === "Escape") setShowMore(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [showMore]);

  const current = remaining.find((t) => t.id === jumpId) || remaining[0] || null;
  // On focusing a task (mount, jump, or auto-advance) reset sub-checks and load
  // however many seconds were already banked for it today, paused.
  useEffect(() => {
    setSubChecks({});
    setTimerStart(null);
    setAccumSec(savedElapsed(data, tk, current?.id));
    setNowMs(Date.now());
  }, [current?.id]);
  const partner = pairPartner(data, current, remaining);
  const pairTasks = current ? (partner ? [current, partner] : [current]) : [];
  const pleasantNote = current && (current.pleasantNote || (partner && partner.pleasantNote));
  const subs = (current && current.subtasks) || [];
  const allSubsChecked = subs.length > 0 && subs.every((s) => subChecks[s.id]);
  const elapsedSec = accumSec + (timerStart == null ? 0 : Math.floor((nowMs - timerStart) / 1000));
  const remainingSec = current && current.eta > 0 ? current.eta * 60 - elapsedSec : 0;
  const cat = current ? data.categories.find((c) => c.id === current.categoryId) : null;

  // Timer persistence: elapsed seconds are stored per task per day, so pausing,
  // switching tasks, or leaving and returning the same day keeps the progress.
  const persistTimer = (taskId, seconds) => {
    if (!taskId) return;
    const timers = { ...(data.timers || {}) };
    timers[tk] = { ...(timers[tk] || {}), [taskId]: seconds };
    persist({ ...data, timers });
  };
  const startTimer = () => { setTimerStart(Date.now()); setNowMs(Date.now()); };
  const pauseTimer = () => {
    if (timerStart == null || !current) return;
    const total = accumSec + Math.max(0, Math.floor((Date.now() - timerStart) / 1000));
    setAccumSec(total);
    setTimerStart(null);
    persistTimer(current.id, total);
  };
  // If the user navigates away mid-run, bank the in-flight segment on unmount so
  // returning to Today the same day resumes from where it was (paused, not reset).
  const bankRef = useRef({});
  bankRef.current = { taskId: current?.id, timerStart, accumSec, tk, data, persist };
  useEffect(() => () => {
    const s = bankRef.current;
    if (!s.taskId || s.timerStart == null) return;
    const seg = Math.max(0, Math.floor((Date.now() - s.timerStart) / 1000));
    if (seg <= 0) return;
    const timers = { ...(s.data.timers || {}) };
    timers[s.tk] = { ...(timers[s.tk] || {}), [s.taskId]: s.accumSec + seg };
    s.persist({ ...s.data, timers });
  }, []);

  // Vacation mode: mark each day it's on so streaks skip it.
  const vacation = !!(data.settings && data.settings.vacation);
  useEffect(() => {
    if (vacation && !isVacationDay(data, tk)) {
      persist({ ...data, settings: { ...(data.settings || {}), vacationDays: [...(data.settings?.vacationDays || []), tk] } });
    }
  }, [vacation, tk]);

  const addQuickTask = () => {
    const nm = quickName.trim();
    if (!nm) return;
    const catId = (data.categories[0] && data.categories[0].id) || null;
    const t = { id: uid(), name: nm, note: "", categoryId: catId, freq: { type: "once", deadline: tk }, rotationLabel: null, priority: null, eta: null, pairId: null, pleasantNote: null, subtasks: [] };
    persist({ ...data, tasks: [...data.tasks, t] });
    setQuickName(""); setShowQuick(false);
  };

  // End-of-day rollover: yesterday incomplete and not yet reviewed.
  const yKey = fmtKey(addDays(new Date(), -1));
  const ySched = useMemo(() => scheduledTasks(data, yKey), [data, yKey]);
  const yEntries = entriesFor(data, yKey);
  const yDone = ySched.filter((t) => yEntries.some((e) => e.taskId === t.id && e.status === "done"));
  const yUnlogged = ySched.filter((t) => !yEntries.some((e) => e.taskId === t.id));
  const showRollover = !vacation && data.settings?.rolloverSeen !== yKey &&
    (!data.createdAt || yKey >= data.createdAt) && ySched.length > 0 && yUnlogged.length > 0;
  const backfillLate = (task) => {
    const history = { ...(data.history || {}) };
    history[yKey] = [...entriesFor(data, yKey), { taskId: task.id, status: "done", late: true, at: Date.now() }];
    persist({ ...data, history });
  };
  const dismissRollover = () => persist({ ...data, settings: { ...(data.settings || {}), rolloverSeen: yKey } });
  const doneCount = entries.filter((e) => e.status === "done").length;
  const skipCount = entries.filter((e) => e.status === "skipped").length;
  const whySeen = data.settings?.whySeen || [];
  const markWhySeen = (id) => persist({ ...data, settings: { ...(data.settings || {}), whySeen: [...whySeen, id] } });

  // Opt-in only: post completed tasks to the shared feed. Never includes
  // skip reasons or notes — just token, task name, category, and time.
  const shareCompletions = async (list) => {
    if (!data.settings || !data.settings.shareActivity) return;
    try {
      const feed = await loadShared(FEED_KEY, []);
      const events = list.map((t) => ({
        profileId, token,
        taskName: t.name,
        category: (data.categories.find((c) => c.id === t.categoryId) || {}).name || null,
        timestamp: Date.now(),
      }));
      const next = [...(Array.isArray(feed) ? feed : []), ...events].slice(-FEED_CAP);
      await saveShared(FEED_KEY, next);
    } catch (e) { console.error("feed share failed", e); }
  };

  // Logs one entry per task (paired cards log both at once), persists once.
  const record = (tasks, status, reason, spentMap) => {
    const list = Array.isArray(tasks) ? tasks : [tasks];
    const now = Date.now();
    const added = list.map((t) => ({ taskId: t.id, status, ...(reason ? { reason } : {}), ...(spentMap && spentMap[t.id] != null ? { spent: spentMap[t.id] } : {}), at: now }));
    const history = { ...(data.history || {}) };
    history[tk] = [...entriesFor(data, tk), ...added];
    persist({ ...data, history });
    if (status === "done") shareCompletions(list);
    setJumpId(null); setSkipping(false); setSkipText(""); setTimerStart(null);
    const label = list.length > 1
      ? (status === "done" ? "Logged both tasks" : "Skipped both tasks")
      : (status === "done" ? `Marked "${list[0].name}" done` : `Skipped "${list[0].name}"`);
    setUndo({ label, count: added.length });
    clearTimeout(undoTimer.current);
    undoTimer.current = setTimeout(() => setUndo(null), 5000);
  };

  const undoLast = () => {
    clearTimeout(undoTimer.current);
    const n = (undo && undo.count) || 1;
    setUndo(null);
    const dayEntries = entriesFor(data, tk);
    if (!dayEntries.length) return;
    const history = { ...(data.history || {}) };
    history[tk] = dayEntries.slice(0, Math.max(0, dayEntries.length - n));
    persist({ ...data, history });
  };

  const markDone = () => {
    if (!current) return;
    setCelebrate(true);
    const list = pairTasks;
    const runSeg = timerStart != null ? Math.max(0, Math.floor((Date.now() - timerStart) / 1000)) : 0;
    const spent = accumSec + runSeg;
    const spentMap = spent > 0 ? { [current.id]: spent } : null;
    timer.current = setTimeout(() => { setCelebrate(false); record(list, "done", null, spentMap); }, 620);
  };

  const streak = useMemo(() => currentStreak(data), [data]);
  const points = pointsBalance(data);

  const redeem = (reward) => {
    if (!reward || points < reward.cost) return;
    const k = todayKey();
    const history = { ...(data.history || {}) };
    history[k] = [...entriesFor(data, k), { kind: "redeem", rewardId: reward.id, name: reward.name, cost: reward.cost, at: Date.now() }];
    persist({ ...data, history });
  };

  const acted = doneCount + skipCount;
  const progress = scheduled.length ? acted / scheduled.length : 0;

  return (
    <div style={{ minHeight: "100vh", background: BASE_BG, display: "flex", flexDirection: "column" }}>
      {/* top progress bar */}
      {scheduled.length > 0 && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: 3, background: LINE, zIndex: 100 }}>
          <div className="df-progress" style={{ height: "100%", width: `${Math.round(progress * 100)}%`, background: BRAND }} />
        </div>
      )}
      {/* header */}
      <div style={{ maxWidth: 520, width: "100%", margin: "0 auto", padding: "18px 20px 0", display: "flex", alignItems: "center", gap: 8, boxSizing: "border-box" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 600, color: INK_SOFT }}>{data.name}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span className="df-display" style={{ fontSize: 19, fontWeight: 500 }}>{niceDate(new Date())}</span>
            {scheduled.length > 0 && <span style={{ fontSize: 12, color: INK_SOFT, fontWeight: 600 }}>{acted} of {scheduled.length}</span>}
            <Why id="one-task" seen={whySeen} onSeen={markWhySeen} />
          </div>
        </div>
        <button onClick={() => setShowRewards(true)} aria-label={`Rewards, ${points} points`} className="df-btn"
          style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5, minHeight: 44, padding: "6px 12px", borderRadius: 999, border: `1px solid ${LINE}`, background: "transparent", color: INK_SOFT, fontSize: 13.5, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" }}>
          <Star size={13} color="#8F6E22" /> {points}
        </button>
        <IconBtn label="Add a task just for today" onClick={() => setShowQuick(true)}><Plus size={18} /></IconBtn>
        <IconBtn label="Today's tasks" onClick={() => setShowOverview(true)}><List size={18} /></IconBtn>
        <div style={{ position: "relative", flexShrink: 0 }}>
          <button aria-label="More" title="More" aria-haspopup="menu" aria-expanded={showMore}
            onClick={() => setShowMore((v) => !v)} className="df-btn"
            style={{ width: 44, height: 44, borderRadius: R_PILL, border: `1px solid ${LINE}`, background: showMore ? CARD : "#FFFFFF", color: INK, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            <MoreHorizontal size={18} />
          </button>
          {showMore && (
            <React.Fragment>
              <div onClick={() => setShowMore(false)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />
              <div role="menu" aria-label="More" className="df-card-in"
                style={{ position: "absolute", top: 50, right: 0, zIndex: 50, background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 12, boxShadow: SHADOW, padding: 6, minWidth: 184, display: "flex", flexDirection: "column", gap: 2 }}>
                {[[Calendar, "Calendar", "calendar"], [Users, "Activity feed", "feed"], [BarChart3, "Summary", "summary"], [Settings, "Manage", "manage"]].map(([Icon, label, dest]) => (
                  <button key={dest} role="menuitem" onClick={() => { setShowMore(false); nav(dest); }} className="df-btn"
                    style={{ display: "flex", alignItems: "center", gap: 12, minHeight: 44, padding: "0 12px", borderRadius: 8, border: "none", background: "transparent", color: INK, fontSize: 15, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", textAlign: "left", width: "100%" }}>
                    <Icon size={18} color={INK_SOFT} /> {label}
                  </button>
                ))}
              </div>
            </React.Fragment>
          )}
        </div>
      </div>

      {/* main card area — generous whitespace, card centered with >= 15vh above */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", maxWidth: 520, width: "100%", margin: "0 auto", padding: "15vh 20px 24px", boxSizing: "border-box" }}>
        {vacation && !breakPeek ? (
          <div className="df-card-in" style={{ textAlign: "center" }}>
            <div className="df-display" style={{ fontSize: 32, fontWeight: 600 }}>On break</div>
            <p style={{ color: INK_SOFT, fontSize: 16, marginTop: 12, lineHeight: 1.5 }}>Streaks are paused. Rest as long as you like, nothing counts against you.</p>
            <div style={{ marginTop: 22, display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
              {scheduled.length > 0 && <GhostBtn onClick={() => setBreakPeek(true)}>Do something anyway</GhostBtn>}
              <GhostBtn onClick={() => nav("manage")}>End break in settings</GhostBtn>
            </div>
          </div>
        ) : scheduled.length === 0 ? (
          <div className="df-card-in" style={{ textAlign: "center" }}>
            <div className="df-display" style={{ fontSize: 30, fontWeight: 500 }}>Nothing scheduled today</div>
            <p style={{ color: INK_SOFT, fontSize: 16, marginTop: 10 }}>Add tasks or adjust their days to fill your flow.</p>
            <div style={{ marginTop: 18 }}><GhostBtn onClick={() => nav("manage")}>Manage tasks</GhostBtn></div>
          </div>
        ) : current ? (
          <div key={current.id} className="df-card-in" style={{ textAlign: "center", position: "relative" }}>
            {celebrate && (
              <div className="df-fade" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(255,255,255,0.72)", pointerEvents: "none", zIndex: 5 }}>
                <Check size={40} color={BRAND} strokeWidth={2.5} />
              </div>
            )}
            <Eyebrow color={cat.color}>{partner ? `${cat.name} · paired` : current.rotationLabel ? `${cat.name} · ${current.rotationLabel}` : cat.name}</Eyebrow>
            <h1 className="df-display" style={{ fontSize: 32, fontWeight: 600, lineHeight: 1.15, margin: "18px 0 0" }}>
              {pairTasks.map((t) => t.name).join(" + ")}
            </h1>
            {current.note && <p style={{ fontSize: 17, color: INK_SOFT, marginTop: 14, lineHeight: 1.5 }}>{current.note}</p>}
            {pleasantNote && <p style={{ fontStyle: "italic", fontSize: 15.5, color: INK_SOFT, marginTop: 8, lineHeight: 1.5 }}>{pleasantNote}</p>}
            {current.freq.type === "weekly" && (
              <p style={{ fontSize: 15, color: INK_SOFT, marginTop: 12, fontWeight: 600 }}>
                {weeklyDoneCount(data, current, tk)} of {Math.max(1, current.freq.count || 1)} this week
              </p>
            )}
            {current.freq.type === "once" && current.freq.deadline && (() => {
              const dleft = daysUntil(current.freq.deadline);
              const urgent = dleft <= 1;
              const txt = dleft <= 0 ? "due today" : dleft === 1 ? "due tomorrow" : `due in ${dleft} days`;
              return (
                <span style={{ display: "inline-block", marginTop: 12, fontSize: 15, fontWeight: 600,
                  color: urgent ? "#A14E3A" : INK_SOFT,
                  ...(urgent ? { background: "#A14E3A1A", border: "1px solid #A14E3A55", padding: "4px 12px", borderRadius: 99 } : {}) }}>
                  {txt}
                </span>
              );
            })()}

            {subs.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 24, textAlign: "left", maxWidth: 340, marginLeft: "auto", marginRight: "auto" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: INK_SOFT, letterSpacing: "0.06em", textTransform: "uppercase" }}>Steps</span>
                  <Why id="two-minute" seen={whySeen} onSeen={markWhySeen} />
                </div>
                {subs.map((s) => {
                  const on = !!subChecks[s.id];
                  return (
                    <button key={s.id} onClick={() => setSubChecks((c) => ({ ...c, [s.id]: !c[s.id] }))} className="df-btn"
                      style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, border: `1px solid ${on ? BRAND : LINE}`, background: on ? BRAND_SOFT : CARD, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                      <span style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", border: `2px solid ${on ? BRAND : "#C7CED4"}`, background: on ? BRAND : "transparent" }}>
                        {on && <Check size={14} color="#FFFFFF" strokeWidth={3} />}
                      </span>
                      <span style={{ fontSize: 15.5, fontWeight: 600, color: INK, textDecoration: on ? "line-through" : "none", opacity: on ? 0.6 : 1 }}>{s.name}</span>
                    </button>
                  );
                })}
              </div>
            )}

            {current.eta > 0 && (timerStart != null || accumSec > 0) && (
              <div style={{ marginTop: 30 }}>
                <div className={remainingSec <= 0 && timerStart != null ? "df-display df-pulse df-num" : "df-display df-num"}
                  style={{ fontSize: "clamp(52px, 17vw, 92px)", fontWeight: 600, lineHeight: 1, color: remainingSec <= 0 ? BRAND : INK }}>
                  {fmtClock(remainingSec)}
                </div>
                <div style={{ fontSize: 13.5, color: INK_SOFT, marginTop: 8, fontWeight: 600 }}>
                  {timerStart == null ? "Paused" : (remainingSec <= 0 ? "time's up, finish when you're ready" : `of ${current.eta} min`)}
                </div>
                <button onClick={timerStart == null ? startTimer : pauseTimer}
                  style={{ marginTop: 10, background: "none", border: "none", color: BRAND, fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: 4 }}>
                  {timerStart == null ? "Resume" : "Pause"}
                </button>
              </div>
            )}

            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 40 }}>
              <PrimaryBtn onClick={markDone} color={BRAND} style={{ minWidth: 150, fontSize: 18, padding: "16px 26px", borderRadius: R_PILL }}>
                <Check size={19} style={{ verticalAlign: "-4px", marginRight: 8 }} />Done
              </PrimaryBtn>
              <GhostBtn onClick={() => setSkipping(true)} style={{ minWidth: 110, padding: "15px 22px", borderRadius: R_PILL }}>Skip</GhostBtn>
            </div>
            {current.eta > 0 && timerStart == null && accumSec === 0 && (
              <div style={{ marginTop: 16 }}>
                <GhostBtn onClick={startTimer} style={{ padding: "11px 20px", fontSize: 15 }}>
                  Start {current.eta}-min timer
                </GhostBtn>
              </div>
            )}
          </div>
        ) : (
          <div className="df-card-in" style={{ textAlign: "center" }}>
            <div className="df-pop" style={{ width: 76, height: 76, borderRadius: 99, background: BRAND, color: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px" }}>
              <Check size={36} strokeWidth={2.5} />
            </div>
            <div className="df-display" style={{ fontSize: 36, fontWeight: 500 }}>Day complete</div>
            <p style={{ color: INK_SOFT, fontSize: 16.5, marginTop: 10 }}>
              {doneCount} done{skipCount ? `, ${skipCount} skipped` : ""}{streak > 1 ? ` · ${streak}-day streak` : ""}. See you tomorrow.
            </p>
            <div style={{ marginTop: 20 }}>
              <GhostBtn onClick={() => nav("summary")}>View summary</GhostBtn>
            </div>
          </div>
        )}
      </div>

      {/* skip sheet */}
      {skipping && (
        <Sheet onClose={() => setSkipping(false)} label="Skip, any reason?" maxHeight="72vh">
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
              <span className="df-display" style={{ fontSize: 21, fontWeight: 500, flex: 1 }}>Skip, any reason?</span>
              <Why id="skip-reasons" seen={whySeen} onSeen={markWhySeen} anchor="right" />
              <IconBtn label="Close" onClick={() => setSkipping(false)}><X size={18} /></IconBtn>
            </div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 12 }}>
              {SKIP_CHIPS.map((c) => (
                <button key={c} onClick={() => record(pairTasks, "skipped", c)} className="df-btn"
                  style={{ padding: "9px 15px", borderRadius: R_PILL, border: `1px solid ${LINE}`, background: "#FFFFFF", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", color: INK }}>
                  {c}
                </button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <TextInput placeholder="Other reason…" value={skipText} onChange={(e) => setSkipText(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && skipText.trim()) record(pairTasks, "skipped", skipText.trim()); }} />
              {skipText.trim() && (
                <PrimaryBtn onClick={() => record(pairTasks, "skipped", skipText.trim())} style={{ padding: "10px 16px", fontSize: 15 }}>Save</PrimaryBtn>
              )}
            </div>
            <div style={{ marginTop: 14, textAlign: "center" }}>
              <TextBtn onClick={() => record(pairTasks, "skipped")}>Skip without a reason</TextBtn>
            </div>
        </Sheet>
      )}

      {/* overview sheet */}
      {showOverview && (
        <Sheet onClose={() => setShowOverview(false)} label="Today's tasks" maxHeight="72vh">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <span className="df-display" style={{ fontSize: 21, fontWeight: 500 }}>Today</span>
              <IconBtn label="Close" onClick={() => setShowOverview(false)}><X size={18} /></IconBtn>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {scheduled.map((t) => {
                const e = entries.find((x) => x.taskId === t.id);
                const c = data.categories.find((x) => x.id === t.categoryId);
                const pending = !e;
                return (
                  <button key={t.id} disabled={!pending}
                    onClick={() => { pauseTimer(); setJumpId(t.id); setSkipping(false); setShowOverview(false); }}
                    className="df-btn"
                    style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: pending ? "#fff" : "transparent", cursor: pending ? "pointer" : "default", fontFamily: "inherit", textAlign: "left", opacity: pending ? 1 : 0.55 }}>
                    <CatDot color={c?.color || INK} />
                    <span style={{ flex: 1 }}>
                      <span style={{ fontWeight: 700, fontSize: 15.5, textDecoration: e?.status === "done" ? "line-through" : "none" }}>{t.name}</span>
                      <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>
                        {e ? (e.status === "done" ? "Done" : `Skipped${e.reason ? ` · ${e.reason}` : ""}`) : c?.name}
                      </span>
                    </span>
                    {e?.status === "done" && <Check size={16} color={INK_SOFT} />}
                    {pending && <span style={{ fontSize: 13, fontWeight: 700, color: INK_SOFT }}>Do now</span>}
                  </button>
                );
              })}
            </div>
        </Sheet>
      )}

      {/* rewards sheet */}
      {showRewards && (
        <Sheet onClose={() => setShowRewards(false)} label="Rewards" maxHeight="72vh">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
              <span className="df-display" style={{ fontSize: 21, fontWeight: 500 }}>Rewards</span>
              <IconBtn label="Close" onClick={() => setShowRewards(false)}><X size={18} /></IconBtn>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
              <Star size={16} color="#8F6E22" />
              <span style={{ fontSize: 15, fontWeight: 700 }}>{points} point{points === 1 ? "" : "s"} to spend</span>
            </div>
            {(!data.rewards || data.rewards.length === 0) ? (
              <p style={{ fontSize: 15, color: INK_SOFT, margin: "4px 2px" }}>No rewards yet. Add some in Manage to start redeeming.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {data.rewards.map((r) => {
                  const affordable = points >= r.cost;
                  return (
                    <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#fff" }}>
                      <span style={{ flex: 1 }}>
                        <span style={{ fontWeight: 700, fontSize: 15.5 }}>{r.name}</span>
                        <span style={{ display: "block", fontSize: 13, color: INK_SOFT }}>{r.cost} point{r.cost === 1 ? "" : "s"}</span>
                      </span>
                      <PrimaryBtn disabled={!affordable} onClick={() => redeem(r)} style={{ padding: "9px 16px", fontSize: 14.5 }}>Redeem</PrimaryBtn>
                    </div>
                  );
                })}
              </div>
            )}
        </Sheet>
      )}

      {/* quick-add sheet */}
      {showQuick && (
        <Sheet onClose={() => setShowQuick(false)} label="Add a task just for today" maxHeight="60vh">
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <span className="df-display" style={{ fontSize: 21, fontWeight: 500 }}>Add a task just for today</span>
            <IconBtn label="Close" onClick={() => setShowQuick(false)}><X size={18} /></IconBtn>
          </div>
          <p style={{ fontSize: 13, color: INK_SOFT, margin: "0 0 14px" }}>A one-off, due today. It won't repeat.</p>
          <div style={{ display: "flex", gap: 8 }}>
            <TextInput placeholder="What needs doing?" value={quickName} autoFocus
              onChange={(e) => setQuickName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addQuickTask(); }} />
            <PrimaryBtn disabled={!quickName.trim()} onClick={addQuickTask} style={{ padding: "10px 18px", fontSize: 15 }}>Add</PrimaryBtn>
          </div>
        </Sheet>
      )}

      {/* end-of-day rollover */}
      {showRollover && (
        <Sheet onClose={dismissRollover} label="Yesterday's tasks" maxHeight="72vh">
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <span className="df-display" style={{ fontSize: 21, fontWeight: 500 }}>Yesterday</span>
            <IconBtn label="Close" onClick={dismissRollover}><X size={18} /></IconBtn>
          </div>
          <p style={{ fontSize: 14, color: INK_SOFT, margin: "0 0 14px" }}>{yDone.length} done, {yUnlogged.length} not logged, mark any as done late?</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {yUnlogged.map((t) => {
              const c = data.categories.find((x) => x.id === t.categoryId);
              return (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, border: `1px solid ${LINE}`, background: "#FFFFFF" }}>
                  <CatDot color={c?.color || INK_SOFT} />
                  <span style={{ flex: 1, fontWeight: 700, fontSize: 15.5 }}>{t.name}</span>
                  <PrimaryBtn onClick={() => backfillLate(t)} style={{ padding: "9px 14px", fontSize: 14 }}>Done (late)</PrimaryBtn>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 14, textAlign: "center" }}>
            <TextBtn onClick={dismissRollover}>That's okay, dismiss</TextBtn>
          </div>
        </Sheet>
      )}

      {/* undo toast */}
      {undo && (
        <div className="df-card-in" role="status"
          style={{ position: "fixed", left: "50%", bottom: 24, transform: "translateX(-50%)", zIndex: 60, display: "flex", alignItems: "center", gap: 14, maxWidth: "calc(100% - 32px)", background: INK, color: "#FFFFFF", padding: "12px 14px 12px 18px", borderRadius: 12, boxShadow: SHADOW }}>
          <span style={{ fontSize: 14.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{undo.label}</span>
          <button onClick={undoLast} className="df-btn"
            style={{ flexShrink: 0, background: "rgba(255,255,255,0.16)", border: "none", color: "#FFFFFF", fontSize: 14.5, fontWeight: 700, padding: "8px 15px", borderRadius: R_PILL, cursor: "pointer", fontFamily: "inherit" }}>
            Undo
          </button>
        </div>
      )}
    </div>
  );
}

/* ————— Summary ————— */
function SummaryView({ data, nav }) {
  const [range, setRange] = useState(7);
  const days = useMemo(() => {
    const out = [];
    for (let i = range - 1; i >= 0; i--) {
      const d = addDays(new Date(), -i);
      const k = fmtKey(d);
      if (data.createdAt && k < data.createdAt) continue;
      const sched = scheduledTasks(data, k);
      const entries = entriesFor(data, k);
      const done = sched.filter((t) => entries.some((e) => e.taskId === t.id && e.status === "done")).length;
      out.push({ key: k, date: d, scheduled: sched, entries, done });
    }
    return out;
  }, [data, range]);

  const totSched = days.reduce((s, d) => s + d.scheduled.length, 0);
  const totDone = days.reduce((s, d) => s + d.done, 0);
  const pct = totSched ? Math.round((totDone / totSched) * 100) : 0;

  const skipCounts = useMemo(() => {
    const m = {};
    days.forEach((d) => d.entries.forEach((e) => {
      if (e.status === "skipped") { const r = e.reason || "No reason given"; m[r] = (m[r] || 0) + 1; }
    }));
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [days]);

  const taskStats = useMemo(() => data.tasks.map((t) => {
    let sched = 0, done = 0;
    days.forEach((d) => {
      if (d.scheduled.some((s) => s.id === t.id)) {
        sched++;
        if (d.entries.some((e) => e.taskId === t.id && e.status === "done")) done++;
      }
    });
    return { task: t, sched, done };
  }).filter((s) => s.sched > 0), [data, days]);

  // Split everything into Personal (all non-Household areas) and Household.
  const householdIds = useMemo(() => new Set(data.categories.filter((c) => c.name === "Household").map((c) => c.id)), [data]);
  const isHousehold = (t) => householdIds.has(t.categoryId);
  const hasHousehold = householdIds.size > 0;
  // Per-day scheduled/done counts for a task subset, for the completion bars.
  const groupDays = (pred) => days.map((d) => {
    const sched = d.scheduled.filter(pred);
    return { key: d.key, date: d.date, sched: sched.length, done: sched.filter((t) => d.entries.some((e) => e.taskId === t.id && e.status === "done")).length };
  });
  const personalDays = groupDays((t) => !isHousehold(t));
  const householdDays = groupDays((t) => isHousehold(t));
  const personalTasks = taskStats.filter((s) => !isHousehold(s.task));
  const householdTasks = taskStats.filter((s) => isHousehold(s.task));

  const cur = useMemo(() => currentStreak(data), [data]);
  const best = useMemo(() => bestStreak(data), [data]);
  const catStreaks = useMemo(() => Object.fromEntries(data.categories.map((c) => [c.id, currentStreak(data, c.id)])), [data]);

  const redemptions = useMemo(() => {
    const out = [];
    days.forEach((d) => d.entries.forEach((e) => { if (e.kind === "redeem") out.push({ ...e, date: d.date }); }));
    return out.sort((a, b) => (b.at || 0) - (a.at || 0));
  }, [days]);

  const matrix = useMemo(() => {
    const q = { must: { s: 0, d: 0 }, important: { s: 0, d: 0 }, wait: { s: 0, d: 0 } };
    days.forEach((day) => day.scheduled.forEach((t) => {
      if (t.priority && q[t.priority]) {
        q[t.priority].s++;
        if (day.entries.some((e) => e.taskId === t.id && e.status === "done")) q[t.priority].d++;
      }
    }));
    return q;
  }, [days]);
  const hasPriorities = Object.values(matrix).some((x) => x.s > 0);

  const Section = ({ title, info, children }) => (
    <div style={{ background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: R_CARD, padding: 18, boxShadow: SHADOW }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <span style={{ fontSize: 13, letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: 600, color: INK_SOFT }}>{title}</span>
        {info && <InfoDot text={info} label={"About " + title} />}
      </div>
      {children}
    </div>
  );

  // Sub-heading used inside a section to separate Personal / Household groups.
  const GroupLabel = ({ children }) => (
    <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: INK_SOFT, marginBottom: 8 }}>{children}</div>
  );

  // One completion block: a percentage headline plus per-day bars.
  const completionBlock = (label, gDays) => {
    const s = gDays.reduce((a, x) => a + x.sched, 0);
    const dn = gDays.reduce((a, x) => a + x.done, 0);
    const p = s ? Math.round((dn / s) * 100) : 0;
    return (
      <div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: INK, flex: 1 }}>{label}</span>
          <span className="df-display df-num" style={{ fontSize: 22, fontWeight: 600 }}>{p}%</span>
          <span style={{ fontSize: 13, color: INK_SOFT }}>{dn} of {s}</span>
        </div>
        {s === 0 ? (
          <p style={{ fontSize: 13.5, color: INK_SOFT, margin: "8px 0 0" }}>Nothing scheduled in this period.</p>
        ) : (
          <div style={{ display: "flex", alignItems: "flex-end", gap: range >= 30 ? 3 : 8, height: range === 1 ? 42 : 72, marginTop: 10 }}>
            {gDays.map((d) => {
              const pr = d.sched ? d.done / d.sched : null;
              return (
                <div key={d.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                  <div style={{ width: "100%", height: range === 1 ? 28 : 56, background: INK + "14", borderRadius: 6, display: "flex", alignItems: "flex-end", overflow: "hidden" }}>
                    {pr != null && <div style={{ width: "100%", height: `${Math.max(pr * 100, 4)}%`, background: BRAND, opacity: 0.35 + pr * 0.65, borderRadius: 6, transition: "height 400ms ease" }} />}
                  </div>
                  {range <= 7 && <span style={{ fontSize: 11.5, fontWeight: 700, color: INK_SOFT }}>{WEEKDAY_LABELS[d.date.getDay()]}</span>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  // One task's completion bar (used in the By-task groups).
  const taskStatRow = ({ task, sched, done }) => {
    const c = data.categories.find((x) => x.id === task.categoryId);
    return (
      <div key={task.id}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 4 }}>
          <CatDot color={c?.color || INK} size={7} />
          <span style={{ flex: 1, fontSize: 15.5, fontWeight: 600 }}>{task.name}</span>
          <span style={{ fontSize: 13.5, fontWeight: 700, color: INK_SOFT }}>done {done}/{sched} {sched === 1 ? "day" : "days"}</span>
        </div>
        <div style={{ height: 7, background: INK + "12", borderRadius: 99 }}>
          <div style={{ width: `${sched ? (done / sched) * 100 : 0}%`, height: "100%", background: BRAND, opacity: sched ? 0.4 + 0.6 * (done / sched) : 0.4, borderRadius: 99, transition: "width 400ms ease" }} />
        </div>
      </div>
    );
  };

  return (
    <div style={{ minHeight: "100vh", background: BASE_BG }}>
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "18px 20px 60px", boxSizing: "border-box" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <IconBtn label="Back to today" onClick={() => nav("today")}><ChevronLeft size={18} /></IconBtn>
          <div className="df-display" style={{ fontSize: 26, fontWeight: 500, flex: 1 }}>Summary</div>
          <div style={{ display: "flex", gap: 5, background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 4 }}>
            {[[1, "Day"], [7, "Week"], [30, "Month"]].map(([v, l]) => (
              <button key={v} onClick={() => setRange(v)} className="df-btn"
                style={{ padding: "6px 12px", borderRadius: R_PILL, border: "none", fontSize: 13.5, fontWeight: 700, fontFamily: "inherit", cursor: "pointer", background: range === v ? BRAND : "transparent", color: range === v ? "#FFFFFF" : INK_SOFT }}>
                {l}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Section title="Completion" info={`How many of your scheduled tasks you finished over the selected ${range === 1 ? "day" : range === 7 ? "week" : "month"}. Each bar is a day. Taller and darker means more done. Personal covers every area except Household.`}>
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              {completionBlock("Personal", personalDays)}
              {hasHousehold && completionBlock("Household", householdDays)}
            </div>
          </Section>

          <Section title="Streaks" info="A day counts toward a streak only when everything scheduled that day is done. Current is your active run; best is your longest ever. The chips show each area's own streak.">
            <div style={{ display: "flex", gap: 24, marginBottom: 12 }}>
              <div><span className="df-display df-num" style={{ fontSize: 28, fontWeight: 600 }}>{cur}</span><span style={{ fontSize: 14, color: INK_SOFT, marginLeft: 7 }}>current</span></div>
              <div><span className="df-display df-num" style={{ fontSize: 28, fontWeight: 600 }}>{best}</span><span style={{ fontSize: 14, color: INK_SOFT, marginLeft: 7 }}>best</span></div>
            </div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {data.categories.map((c) => (
                <span key={c.id} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "7px 12px", borderRadius: 99, background: "#FFFFFF", border: `1px solid ${LINE}`, color: INK, fontSize: 13.5, fontWeight: 700 }}>
                  <CatDot color={c.color} size={7} /> {c.name} · {catStreaks[c.id]}
                </span>
